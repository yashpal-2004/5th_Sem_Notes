<title>Computer Networks · MCQ Practice Lab</title>
<style>
:root{--bg:#f2f4f6;--surface:#fff;--border:#e2e8ee;--ink:#1a2733;--muted:#5a6b78;--accent:#1e606d;--accent-light:#e9f5f7;--easy:#1a7a4e;--easy-bg:#eaf5ef;--easy-border:#b7dfca;--medium:#c47a16;--medium-bg:#fef8ec;--medium-border:#f0d9a0;--hard:#b03535;--hard-bg:#fef0f0;--hard-border:#f5bfbf;--correct:#1a7a4e;--correct-bg:#eaf5ef;--correct-border:#34784a;--wrong:#b03535;--wrong-bg:#fef0f0;--wrong-border:#c95555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font:15px/1.65 'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;}
header{background:#113840;color:#fff;padding:22px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.header-left h1{font-size:clamp(18px,3vw,24px);font-weight:700;letter-spacing:-.3px;}
.header-left p{font-size:12px;color:#9eccc5;margin-top:2px;}
.score-box{display:flex;gap:20px;align-items:center;}
.score-item{text-align:center;}.score-item .val{font-size:22px;font-weight:800;line-height:1;}.score-item .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9eccc5;margin-top:2px;}
.score-item.correct .val{color:#5de0b8;}.score-item.wrong .val{color:#f4897a;}.score-item.remain .val{color:#e5d97e;}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
.level-section{margin-bottom:40px;}.level-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--border);}
.level-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:20px;}
.level-badge.Easy{background:var(--easy-bg);color:var(--easy);border:1px solid var(--easy-border);}
.level-badge.Medium{background:var(--medium-bg);color:var(--medium);border:1px solid var(--medium-border);}
.level-badge.Hard{background:var(--hard-bg);color:var(--hard);border:1px solid var(--hard-border);}
.level-count{font-size:13px;color:var(--muted);}.level-score{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);}
.q-grid{display:grid;gap:16px;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;transition:box-shadow .2s;}
.q-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07);}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.q-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.q-num.Easy{background:var(--easy);}.q-num.Medium{background:var(--medium);}.q-num.Hard{background:var(--hard);}
.q-topic{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.q-prompt{font-size:15px;font-weight:600;line-height:1.55;margin-bottom:16px;color:var(--ink);}
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{width:100%;display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:12px 15px;cursor:pointer;text-align:left;font:inherit;font-size:14px;color:var(--ink);line-height:1.5;transition:border-color .15s,background .15s,transform .1s;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);transform:translateX(3px);}
.opt-letter{min-width:24px;height:24px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:background .15s,border-color .15s,color .15s;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct-border);}
.opt-btn.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#fff;}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);}
.opt-btn.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff;}
.opt-btn.neutral:disabled{opacity:.55;}
.result-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.result-badge.correct{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct-border);}
.result-badge.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong-border);}
.explanation{margin-top:10px;background:#f7fafc;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 14px;font-size:13px;color:var(--muted);line-height:1.6;}
.progress-wrap{background:var(--border);height:4px;border-radius:10px;margin-bottom:28px;overflow:hidden;}
.progress-bar{height:100%;background:var(--accent);border-radius:10px;transition:width .3s ease;width:0%;}
.reset-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.reset-btn:hover{background:#154e58;}
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
.top-bar-left{font-size:14px;color:var(--muted);}
@media(max-width:640px){header{padding:16px;}main{padding:20px 14px 50px;}.q-card{padding:16px;}.score-item .val{font-size:18px;}}
</style>

<body>
<header>

    <h1>Computer Networks · MCQ Practice Lab</h1>

<script>
'use strict';
const BANK=[
{"id":1,"topic":"OSI Model","level":"Easy","prompt":"The OSI model has 7 layers. Which layer is responsible for end-to-end error detection, flow control, and reliable data transfer between two hosts?","options":["Transport Layer (Layer 4)","Network Layer (Layer 3)","Data Link Layer (Layer 2)","Session Layer (Layer 5)"],"explanation":"The Transport Layer provides end-to-end communication services: segmentation, reassembly, error detection/correction, and flow control. TCP operates at this layer. The Network Layer handles routing between networks, and the Data Link Layer handles node-to-node delivery on a single link."},
{"id":2,"topic":"OSI vs TCP/IP","level":"Easy","prompt":"The TCP/IP model combines the OSI Presentation and Session layers into which TCP/IP layer?","options":["Application layer in TCP/IP absorbs OSI Layers 5, 6, and 7.","Transport layer in TCP/IP absorbs OSI Layers 5 and 6.","Network layer in TCP/IP absorbs OSI Layers 3 and 5.","Internet layer in TCP/IP includes OSI Layer 6 only."],"explanation":"TCP/IP has 4 layers: Application (merges OSI 5, 6, 7), Transport (OSI 4), Internet (OSI 3), and Network Access (OSI 1+2). The Presentation and Session layers have no distinct TCP/IP counterparts; their functions are handled by application protocols like TLS and HTTP."},
{"id":3,"topic":"Physical Layer","level":"Easy","prompt":"Bandwidth of a channel is 4 MHz and the signal has 4 discrete levels. Using the Nyquist formula for a noiseless channel, what is the maximum theoretical data rate?","options":["16 Mbps: Nyquist rate = 2 × B × log₂(L) = 2 × 4 × log₂(4) = 16 Mbps.","8 Mbps: Nyquist rate = B × log₂(L) = 4 × 2 = 8 Mbps.","32 Mbps: doubling the bandwidth doubles the rate regardless of signal levels.","4 Mbps: the rate equals the bandwidth in Hz for multilevel signals."],"explanation":"Nyquist theorem: Max rate = 2 × B × log₂(L) where B = bandwidth (Hz) and L = signal levels. 2 × 4 × 10⁶ × log₂(4) = 2 × 4 × 10⁶ × 2 = 16 × 10⁶ bps = 16 Mbps. Shannon's formula further limits this in the presence of noise."},
{"id":4,"topic":"Data Link Layer","level":"Easy","prompt":"CRC (Cyclic Redundancy Check) is an error detection scheme. A sender computes CRC by dividing the data polynomial by a generator polynomial. What is appended to the data before transmission?","options":["The remainder of the polynomial division is appended to the data as the CRC check bits.","The quotient of the polynomial division is appended to uniquely identify the data block.","The generator polynomial itself is appended so the receiver can recompute the CRC.","The XOR of all data bytes is appended as a single-byte checksum."],"explanation":"CRC: the data bits are treated as a polynomial M(x). M(x) is shifted left by r bits (appending r zeros) and divided by the generator G(x) of degree r. The remainder R(x) is the CRC. The transmitted frame is M(x) shifted left XOR R(x), which is divisible by G(x). The receiver divides the received frame by G(x) and checks for zero remainder."},
{"id":5,"topic":"Framing","level":"Easy","prompt":"Bit stuffing in HDLC inserts a 0 after every sequence of five consecutive 1s in the data. Why?","options":["To prevent the data from accidentally matching the flag byte 01111110, which marks frame boundaries.","To balance the number of 0s and 1s for more reliable clock synchronization in all conditions.","To compress repetitive 1-bit sequences and improve transmission efficiency.","To allow the receiver to detect single-bit errors without a separate CRC field."],"explanation":"HDLC uses the flag 01111110 (six 1s between two 0s) to delimit frames. If data contains six or more consecutive 1s, the receiver might see a false flag. Bit stuffing inserts a 0 after every five 1s in the data. The receiver removes any 0 following five 1s, recovering the original data."},
{"id":6,"topic":"MAC Protocols","level":"Easy","prompt":"CSMA/CD (Carrier Sense Multiple Access with Collision Detection) is used in Ethernet. What action does a station take immediately upon detecting a collision?","options":["It stops transmitting, sends a jam signal to ensure all stations detect the collision, then backs off using exponential backoff.","It retransmits the frame immediately without waiting for the channel to clear.","It waits for the channel to be idle for exactly one propagation delay before retransmitting.","It discards the frame and requests the sender at the source to initiate a new transmission."],"explanation":"Upon collision detection: (1) Abort transmission immediately. (2) Send a 48-bit jam signal to ensure all stations know about the collision. (3) Wait a random backoff time from {0,...,2^k-1} slot times (binary exponential backoff, k = attempt count up to 10). Then retry. After 16 failures, report an error."},
{"id":7,"topic":"IPv4 Addressing","level":"Easy","prompt":"A host has IP address 192.168.10.55 with subnet mask 255.255.255.192. What is the network address of the subnet this host belongs to?","options":["192.168.10.0 — performing bitwise AND: 55 AND 192 = 0 (192 = 11000000, 55 = 00110111, AND = 00000000).","192.168.10.55 — the host address equals the network address when the mask is 255.255.255.192.","192.168.10.192 — the subnet starts at the mask boundary.","192.168.10.64 — the next subnet begins at 64, so this host is in the 64 subnet."],"explanation":"Network address = IP AND Mask. 55 in binary = 00110111. 192 = 11000000. AND = 00000000. So the 4th octet is 0, giving 192.168.10.0. The subnet covers .0–.63 (64 addresses, /26 prefix). The host .55 is within this range."},
{"id":8,"topic":"Transport Layer","level":"Easy","prompt":"TCP uses a three-way handshake to establish a connection. What is the correct sequence of segments?","options":["SYN → SYN-ACK → ACK: client sends SYN, server replies SYN-ACK, client confirms with ACK.","SYN → ACK → SYN-ACK: client sends SYN, server sends ACK, then SYN-ACK.","ACK → SYN → SYN-ACK: server initiates with ACK, client responds with SYN.","SYN → SYN → ACK: both sides send SYN before any ACK is exchanged."],"explanation":"TCP three-way handshake: (1) Client sends SYN with its initial sequence number (ISN). (2) Server responds with SYN-ACK (acknowledging client ISN+1 and sending its own ISN). (3) Client sends ACK (acknowledging server ISN+1). After this, both sides are in ESTABLISHED state and data transfer can begin."},
{"id":9,"topic":"DNS","level":"Easy","prompt":"DNS resolves domain names to IP addresses. In iterative resolution, who performs all the recursive queries?","options":["The local DNS resolver performs all queries, contacting root, TLD, and authoritative servers in sequence.","The client browser directly contacts each DNS server type in sequence.","The root DNS server queries all downstream servers and returns the final answer.","The authoritative server contacts the root and TLD servers on behalf of the client."],"explanation":"Iterative resolution: the client's local resolver does the work. It queries the root nameserver, which replies with a referral to the TLD server. The resolver queries the TLD server, which refers to the authoritative server. The resolver queries the authoritative server and returns the IP to the client. No server queries on behalf of another."},
{"id":10,"topic":"Application Layer Protocols","level":"Easy","prompt":"HTTP/1.1 introduced persistent connections. What problem with HTTP/1.0 does this solve?","options":["HTTP/1.0 opened a new TCP connection for every request/response pair, causing high connection setup overhead.","HTTP/1.0 used UDP, which was unreliable; HTTP/1.1 switched to persistent TCP.","HTTP/1.0 did not support any caching mechanism, which persistent connections enable.","HTTP/1.0 used a binary protocol; HTTP/1.1 text-based persistent connections are more efficient."],"explanation":"HTTP/1.0 defaulted to non-persistent: each object required a separate TCP connection with a full three-way handshake. For a page with 10 images, 11 connections are needed. HTTP/1.1 persistent connections reuse the same TCP connection for multiple requests, drastically reducing latency and server load."},
{"id":11,"topic":"Subnetting","level":"Medium","prompt":"An organization is assigned 172.16.0.0/16. It needs to create 60 subnets, each supporting at least 500 hosts. What prefix length should be used?","options":["172.16.0.0/22: 2^6=64 ≥ 60 subnets (6 subnet bits), 22 bits network, 10 host bits = 1022 usable hosts ≥ 500.","172.16.0.0/24: 8 host bits give 254 hosts, insufficient for 500 per subnet.","172.16.0.0/21: 5 subnet bits give only 32 subnets, insufficient for 60.","172.16.0.0/20: 4 subnet bits give 16 subnets, insufficient for 60."],"explanation":"Need: ≥60 subnets → ⌈log₂(60)⌉ = 6 subnet bits. Need: ≥500 hosts → ⌈log₂(502)⌉ = 9 host bits (giving 510 usable). Total: 16 (original prefix) + 6 (subnet) = 22 bits → /22. This gives 64 subnets and 2^10−2 = 1022 hosts per subnet. Both requirements are satisfied."},
{"id":12,"topic":"TCP Flow Control","level":"Medium","prompt":"TCP's sliding window flow control uses the receiver's advertised window (rwnd). If rwnd = 0, the sender stops transmitting. How does the sender know when it can resume sending?","options":["The receiver sends a window update segment with a non-zero rwnd when buffer space becomes available.","The sender uses a persist timer to periodically probe the receiver with a 1-byte segment to check if rwnd has increased.","The sender waits for a fixed timeout (RTO) and then assumes rwnd is non-zero.","The connection is terminated and restarted with a new SYN when rwnd remains 0."],"explanation":"When rwnd=0, the sender stops but starts a persist timer. Periodically it sends a 1-byte probe (window probe). If the receiver has freed buffer space, it responds with an ACK and non-zero rwnd, allowing the sender to resume. This prevents deadlock if the receiver's window update segment is lost."},
{"id":13,"topic":"Network Layer","level":"Medium","prompt":"In CIDR (Classless Inter-Domain Routing), an IP address block is written as 192.0.2.0/24. A router matches an incoming packet's destination against its routing table. If multiple prefixes match, which does the router select?","options":["Longest prefix match: the entry with the most specific (longest) matching prefix is selected.","First match: the first matching entry in the table (by insertion order) is used.","Shortest prefix match: the most general covering route is preferred for efficiency.","Exact match only: if no exact host route exists, the default route is used directly."],"explanation":"Routers use longest prefix matching (LPM): among all matching routing table entries, the one with the longest prefix (most specific) wins. This allows a default route (/0) to coexist with more specific entries (e.g., /24). LPM is implemented efficiently with tries or TCAM in hardware."},
{"id":14,"topic":"Propagation and Transmission Delays","level":"Medium","prompt":"A 1 Mbps link has a propagation delay of 10 ms. A sender transmits a 1000-byte frame. What is the transmission delay?","options":["8 ms: transmission delay = frame_size / bandwidth = 1000 × 8 bits / 1,000,000 bps = 8 ms.","10 ms: the transmission delay equals the propagation delay for this frame size.","1 ms: 1000 bytes / 1 Mbps neglecting bit conversion.","18 ms: the total delay is the sum of transmission and propagation delays."],"explanation":"Transmission delay = L/R = (1000 bytes × 8 bits/byte) / 1,000,000 bps = 8000/1,000,000 = 0.008 s = 8 ms. This is independent of propagation delay (10 ms). Total end-to-end delay for first bit to arrive = 8 ms + 10 ms = 18 ms, but the question asks only for transmission delay."},
{"id":15,"topic":"Error Detection","level":"Medium","prompt":"A checksum is computed over a UDP datagram. The receiver recomputes the checksum and compares. If the computed checksum does not match the received checksum, what does the receiver do with the UDP datagram?","options":["UDP discards the segment silently; error recovery is left to the application or transport layer above.","UDP retransmits the segment automatically after detecting the checksum mismatch.","UDP sends a NAK (Negative Acknowledgement) to the sender to trigger retransmission.","UDP corrects the error using the checksum bits and delivers the corrected data to the application."],"explanation":"UDP is a best-effort, connectionless protocol. The checksum provides error detection but not correction or recovery. If the checksum fails, UDP drops the datagram — no retransmission, no NAK. If reliability is needed, the application layer or TCP must handle it."},
{"id":16,"topic":"TCP Congestion Control","level":"Medium","prompt":"TCP Reno's congestion control starts in slow start (exponential growth). When does slow start transition to congestion avoidance (linear/additive increase)?","options":["When cwnd reaches the slow start threshold (ssthresh), TCP switches to additive increase of 1 MSS per RTT.","When cwnd exceeds the receiver's advertised window (rwnd), TCP slows to linear growth.","When a timeout occurs, TCP immediately enters congestion avoidance at cwnd/2.","When cwnd reaches the link's bandwidth-delay product, exponential growth stops automatically."],"explanation":"TCP slow start doubles cwnd each RTT (exponential). When cwnd reaches ssthresh, it switches to congestion avoidance: cwnd += 1 MSS per RTT (additive). On timeout: ssthresh = cwnd/2, cwnd = 1 MSS, restart slow start. On triple duplicate ACK (Reno): ssthresh = cwnd/2, cwnd = ssthresh, enter congestion avoidance (fast recovery)."},
{"id":17,"topic":"IPv4 Header","level":"Medium","prompt":"The TTL (Time To Live) field in the IPv4 header is decremented by each router. What is the primary purpose of this field?","options":["To prevent packets from looping indefinitely in case of routing loops; the packet is discarded when TTL reaches 0.","To specify how long the packet should be cached in router buffers before forwarding.","To indicate the maximum number of bytes the packet can grow due to IP options.","To control the QoS priority so that lower TTL packets are forwarded first."],"explanation":"TTL is decremented by 1 at each hop. When TTL=0, the router discards the packet and sends an ICMP 'Time Exceeded' message to the source. This prevents packets from circling forever in routing loops. Traceroute exploits TTL by sending packets with increasing TTL values to identify each hop."},
{"id":18,"topic":"Application Layer","level":"Medium","prompt":"FTP uses two separate TCP connections: a control connection (port 21) and a data connection (port 20 in active mode). What is sent over the control connection?","options":["Commands (USER, PASS, LIST, RETR) and responses, but actual file data travels over the separate data connection.","File data only; commands use UDP on port 21 for lower overhead.","Both commands and file data are multiplexed over a single connection to port 21.","Encryption keys and authentication tokens, while plaintext data uses the data connection."],"explanation":"FTP separates control and data for a specific reason: the control connection (port 21) handles commands and replies throughout the entire session. A new data connection (port 20 active / ephemeral passive) is opened for each file transfer or directory listing, then closed. This lets the control channel remain open between transfers."},
{"id":19,"topic":"MAC Addressing","level":"Medium","prompt":"A switch receives a frame with a destination MAC address it has never seen before. What does it do?","options":["Flood: it forwards the frame out of all ports except the port on which it was received.","Drop: unknown destination MACs are discarded to prevent security risks.","Broadcast: it forwards the frame using the broadcast MAC (FF:FF:FF:FF:FF:FF).","Query ARP: it sends an ARP request to find the port associated with the destination MAC."],"explanation":"Switches learn source MAC addresses dynamically (populating the MAC address table). For unknown destination MACs, they flood the frame to all ports except the incoming port. When the destination replies, the switch learns its port. ARP operates at Layer 3 between IP and MAC; switches operate at Layer 2 only."},
{"id":20,"topic":"Routing Protocols","level":"Medium","prompt":"RIP (Routing Information Protocol) uses hop count as its metric, with a maximum of 15 hops. Why does this limitation exist and what problem does it solve?","options":["The 15-hop limit prevents routing loops from running indefinitely; any path exceeding 15 hops is considered unreachable.","The 15-hop limit is chosen because RIP routing tables cannot store more than 15 entries.","The limit ensures RIP converges faster than OSPF on networks smaller than 15 routers.","The 15-hop limit reduces memory usage by preventing large routing tables."],"explanation":"RIP uses distance-vector routing which is prone to count-to-infinity: in a routing loop, hop counts increment indefinitely. The 16-hop (infinity) limit caps this: a route with metric 16 is treated as unreachable. This bounds the damage but also limits RIP to small networks (max diameter 15 hops)."},
{"id":21,"topic":"IPv4 Fragmentation","level":"Hard","prompt":"An IPv4 datagram of 4000 bytes (including 20-byte header) must traverse a link with MTU = 1500 bytes. Into how many fragments is it divided, and what are their sizes?","options":["3 fragments: 1500 + 1500 + 1040 bytes (first two carry 1480 data bytes each, last carries 1000−20+20=1020 bytes). Actually: data=3980 bytes. Frag1=1480 data+20 hdr=1500, Frag2=1480 data+20 hdr=1500, Frag3=1020 data+20 hdr=1040.","2 fragments: 2000 + 2000 bytes, split evenly.","4 fragments of 1000 bytes each.","The datagram cannot be fragmented if the DF bit is set; it is dropped."],"explanation":"Total data = 4000 − 20 = 3980 bytes. MTU = 1500, max data per fragment = 1480 (multiple of 8). Fragment 1: 1480 data bytes, offset 0. Fragment 2: 1480 data bytes, offset 185 (1480/8). Fragment 3: 3980−2960 = 1020 data bytes, offset 370. Three fragments with total sizes 1500 + 1500 + 1040 bytes."},
{"id":22,"topic":"TCP Connection Termination","level":"Hard","prompt":"TCP uses a four-way handshake to close a connection. Why is a four-way exchange needed instead of a two-way exchange like connection establishment?","options":["Because TCP is full-duplex; each direction must be closed independently, requiring a separate FIN-ACK pair for each direction.","Because the four-way handshake allows retransmission of lost FIN segments in all directions.","Because the server must send its remaining data before acknowledging the client's FIN.","Because TCP's timer-based TIME_WAIT state requires an extra round trip to expire safely."],"explanation":"TCP is full-duplex: data can flow in both directions independently. When the client sends FIN, it indicates it has no more data to send, but the server may still have data. The server ACKs the client's FIN, continues sending data, then eventually sends its own FIN. The client ACKs this FIN. Each direction closes independently, requiring 4 segments total."},
{"id":23,"topic":"Network Layer","level":"Hard","prompt":"NAT (Network Address Translation) allows multiple private IP addresses to share a single public IP. It works by modifying IP and TCP/UDP headers. What field allows the NAT box to distinguish return traffic destined for different internal hosts sharing the same public IP?","options":["Source port numbers: each internal connection is mapped to a unique (public IP, port) pair, called NAPT or PAT.","Source IP address: each internal host uses a different public IP from a pool.","TCP sequence numbers: each connection uses a unique sequence space.","The TTL field: different internal hosts decrement TTL by different amounts."],"explanation":"Basic NAT maps one private IP to one public IP (requires a pool). NAPT (PAT — Port Address Translation), the common case, maps (private IP, private port) to (public IP, unique public port). The NAT table stores these mappings. Return traffic arrives at the public IP:port, the NAT box translates to the correct internal host using its table."},
{"id":24,"topic":"TCP Congestion Control","level":"Hard","prompt":"TCP CUBIC (used in Linux) uses a cubic function of time since the last congestion event rather than ACK-clocked window growth. Why does CUBIC outperform Reno on high bandwidth-delay product (BDP) links?","options":["CUBIC's cubic growth reaches the old cwnd quickly after recovery and probes aggressively for more bandwidth, utilizing the large pipe better than Reno's linear additive increase.","CUBIC eliminates slow start entirely, always starting at the maximum window size.","CUBIC uses the RTT directly to compute window size, avoiding the feedback loop inherent in Reno.","CUBIC reduces ssthresh more aggressively than Reno, causing faster convergence to the link rate."],"explanation":"On high-BDP links (e.g., 10 Gbps, 100 ms RTT), Reno's additive increase of 1 MSS per RTT is extremely slow to recover after a drop (would take thousands of RTTs to recover a large window). CUBIC's cubic function grows quickly away from the congestion point and slows near the estimated maximum, efficiently utilizing high-BDP links."},
{"id":25,"topic":"DNS","level":"Hard","prompt":"DNS uses both UDP (port 53) and TCP (port 53). Under what conditions does DNS switch from UDP to TCP?","options":["When the DNS response exceeds 512 bytes (traditional limit) or 4096 bytes (with EDNS0), the resolver retries using TCP.","DNS always uses TCP; UDP is only used for multicast DNS (mDNS) in local networks.","DNS uses TCP only for DNSSEC-signed zones because signature data is large.","DNS uses TCP only for zone transfers (AXFR/IXFR) between authoritative servers, never for client queries."],"explanation":"DNS queries use UDP for speed (no connection overhead). If the response is truncated (TC bit set), the resolver retries over TCP. Zone transfers (AXFR) always use TCP due to large data. EDNS0 extends the UDP payload limit to 4096 bytes, reducing TCP fallback. DNSSEC responses are often large and may trigger TCP."},
{"id":26,"topic":"HTTP and Web","level":"Hard","prompt":"HTTP/2 introduces header compression via HPACK and multiplexed streams over a single TCP connection. What specific problem does stream multiplexing solve that HTTP/1.1 pipelining could not?","options":["Head-of-line (HOL) blocking: in HTTP/1.1, a stalled response blocks all subsequent pipelined responses. HTTP/2 streams are independent, so one stalled stream does not delay others.","HTTP/1.1 pipelining requires multiple TCP connections; HTTP/2 multiplexing uses only one, saving ports.","HTTP/2 multiplexing encrypts individual streams, while HTTP/1.1 pipelining sends all data in plaintext.","HTTP/2 eliminates retransmissions by using unreliable streams, which HTTP/1.1 pipelining could not achieve."],"explanation":"HTTP/1.1 pipelining sends multiple requests but responses must arrive in order. If response 2 is delayed, response 3 is blocked (HOL blocking). HTTP/2 assigns each request/response a stream ID. Streams are interleaved in frames; a slow stream doesn't block others. Note: TCP-level HOL blocking remains until HTTP/3 (QUIC)."},
{"id":27,"topic":"Routing","level":"Hard","prompt":"OSPF (Open Shortest Path First) is a link-state routing protocol. Each router floods its link-state advertisement (LSA) to all routers. What algorithm does each router run on its topology database to compute shortest paths?","options":["Dijkstra's shortest path first (SPF) algorithm, run locally on the complete topology graph stored in the LSDB.","Bellman-Ford algorithm: each router exchanges distance vectors iteratively until convergence.","Spanning tree protocol: OSPF builds a loop-free tree by disabling redundant links.","Floyd-Warshall algorithm: each router computes all-pairs shortest paths for full redundancy."],"explanation":"OSPF routers maintain a Link-State Database (LSDB) — an identical copy of the topology on every router. Each runs Dijkstra's SPF independently to compute the shortest-path tree rooted at itself. This gives consistent, loop-free routing with O(N log N) computation. Bellman-Ford is used by distance-vector protocols like RIP."},
{"id":28,"topic":"Ethernet and Switching","level":"Hard","prompt":"The Spanning Tree Protocol (STP, IEEE 802.1D) prevents broadcast storms in switched Ethernet networks with redundant paths. How does STP achieve a loop-free topology?","options":["It elects a root bridge and blocks redundant ports (Alternate and Backup roles), keeping only the shortest path tree active while maintaining blocked ports as standby failover paths.","It disables all redundant links permanently, reducing the network to a single path between any two switches.","It uses TTL decrement on Ethernet frames to limit broadcast propagation to a fixed hop count.","It assigns each port a unique VLAN so that broadcast domains never overlap."],"explanation":"STP elects a root bridge (lowest Bridge ID). Each non-root switch identifies its root port (closest to root). For each LAN segment, one designated port is elected. Redundant ports are put in Blocking state. The result is a spanning tree — no loops. Blocked ports monitor for topology changes and can transition to Forwarding if the active path fails."},
{"id":29,"topic":"Transport Layer","level":"Hard","prompt":"TCP's TIME_WAIT state lasts 2×MSL (Maximum Segment Lifetime, typically 2 minutes = 4 minutes total). What are the two reasons for this long wait?","options":["(1) To allow delayed packets from the closed connection to expire so they are not mistaken for a new connection. (2) To ensure the final ACK reaches the remote side (if it is lost, the remote retransmits FIN and the ACK can be resent).","(1) To prevent the port from being reused before all routers clear their routing caches. (2) To give the OS time to release socket buffers.","(1) To allow ICMP error messages about the closed connection to propagate back. (2) To protect against sequence number wrap-around.","(1) To let the remote side complete its own TIME_WAIT. (2) To synchronize clocks between the two endpoints."],"explanation":"TIME_WAIT exists for two reasons: (1) The final ACK (to the remote's FIN) may be lost. The remote retransmits FIN, and TIME_WAIT allows the local side to resend the ACK. (2) Delayed duplicate segments from the old connection could corrupt a new connection on the same 4-tuple. Waiting 2×MSL ensures all old segments have expired."},
{"id":30,"topic":"Application Layer","level":"Hard","prompt":"DHCP uses a four-message exchange (DORA) to assign an IP address. A client sends a DHCPDISCOVER as a broadcast. Why must the discover message be a broadcast if the client has no IP address yet?","options":["Because the client does not know the DHCP server's IP address or its own IP, it broadcasts to 255.255.255.255 so all hosts on the local subnet receive the message, including any DHCP server.","Because DHCP uses UDP which cannot perform unicast without a valid source IP; broadcast bypasses this requirement.","Because the client's NIC is in promiscuous mode during DHCP discovery, requiring a broadcast to activate it.","Because routers block DHCP traffic, so broadcasting ensures the message stays within the local subnet."],"explanation":"A new client has no IP address (source IP 0.0.0.0) and does not know the DHCP server's address. Broadcasting to 255.255.255.255 reaches all hosts on the local network, including DHCP servers. Routers normally do not forward limited broadcasts — but a DHCP relay agent (ip helper-address) can forward DHCP broadcasts across subnets as unicasts to a remote DHCP server."}
];

let correct=0,wrong=0,answered=0;
const LETTERS=['A','B','C','D'];
const correctMap={};
function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateHeader(){document.getElementById('hdr-correct').textContent=correct;document.getElementById('hdr-wrong').textContent=wrong;document.getElementById('hdr-remain').textContent=BANK.length-answered;document.getElementById('progress-bar').style.width=(answered/BANK.length*100)+'%';}
function buildQuiz(){const root=document.getElementById('quiz-root');root.innerHTML='';['Easy','Medium','Hard'].forEach(level=>{const qs=BANK.filter(q=>q.level===level);const section=document.createElement('div');section.className='level-section';section.innerHTML=`<div class="level-header"><span class="level-badge ${level}">${level}</span><span class="level-count">${qs.length} questions</span><span class="level-score" id="score-${level}">0 answered</span></div><div class="q-grid" id="grid-${level}"></div>`;root.appendChild(section);const grid=section.querySelector('#grid-'+level);qs.forEach(q=>{const card=document.createElement('div');card.className='q-card';card.id='q-'+q.id;const idxArr=shuffleArr([0,1,2,3]);const shuffled=idxArr.map(i=>q.options[i]);correctMap[q.id]=idxArr.indexOf(0);card.innerHTML=`<div class="q-meta"><div class="q-num ${level}">${q.id}</div><span class="q-topic">${q.topic}</span></div><div class="q-prompt">${q.prompt}</div><div class="options">${shuffled.map((opt,i)=>`<button class="opt-btn" onclick="answer(${q.id},${i})"><span class="opt-letter">${LETTERS[i]}</span><span>${opt}</span></button>`).join('')}</div><div id="fb-${q.id}"></div>`;grid.appendChild(card);});});}
function answer(qId,chosenIdx){const q=BANK.find(x=>x.id===qId);const card=document.getElementById('q-'+qId);const feedback=document.getElementById('fb-'+qId);const btns=card.querySelectorAll('.opt-btn');btns.forEach(b=>b.disabled=true);const correctIdx=correctMap[qId];const isCorrect=chosenIdx===correctIdx;btns.forEach((btn,i)=>{if(i===correctIdx)btn.classList.add('correct');else if(i===chosenIdx&&!isCorrect)btn.classList.add('wrong');else btn.classList.add('neutral');});if(isCorrect){correct++;feedback.innerHTML=`<div class="result-badge correct"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Correct!</div><div class="explanation">${q.explanation}</div>`;}else{wrong++;feedback.innerHTML=`<div class="result-badge wrong"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Incorrect — correct answer highlighted above</div><div class="explanation">${q.explanation}</div>`;}answered++;updateHeader();const sc=document.getElementById('score-'+q.level);if(sc){const done=BANK.filter(x=>x.level===q.level).filter(x=>{const c=document.getElementById('q-'+x.id);return c&&c.querySelector('.opt-btn[disabled]');}).length;sc.textContent=done+' answered';}}
function resetAll(){correct=0;wrong=0;answered=0;Object.keys(correctMap).forEach(k=>delete correctMap[k]);updateHeader();buildQuiz();}
buildQuiz();updateHeader();
</script>
