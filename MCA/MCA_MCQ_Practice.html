<title>Modern Computer Architecture · MCQ Practice Lab</title>
<style>
:root{--bg:#f2f4f6;--surface:#fff;--border:#e2e8ee;--ink:#1a2733;--muted:#5a6b78;--accent:#6d4c3d;--accent-light:#f7f0ec;--easy:#1a7a4e;--easy-bg:#eaf5ef;--easy-border:#b7dfca;--medium:#c47a16;--medium-bg:#fef8ec;--medium-border:#f0d9a0;--hard:#b03535;--hard-bg:#fef0f0;--hard-border:#f5bfbf;--correct:#1a7a4e;--correct-bg:#eaf5ef;--correct-border:#34784a;--wrong:#b03535;--wrong-bg:#fef0f0;--wrong-border:#c95555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font:15px/1.65 'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;}
header{background:#2a1c16;color:#fff;padding:22px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.header-left h1{font-size:clamp(18px,3vw,24px);font-weight:700;letter-spacing:-.3px;}
.header-left p{font-size:12px;color:#c4aea4;margin-top:2px;}
.score-box{display:flex;gap:20px;align-items:center;}
.score-item{text-align:center;}.score-item .val{font-size:22px;font-weight:800;line-height:1;}.score-item .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#c4aea4;margin-top:2px;}
.score-item.correct .val{color:#5de0b8;}.score-item.wrong .val{color:#f4897a;}.score-item.remain .val{color:#e5d97e;}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
.level-section{margin-bottom:40px;}.level-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--border);}
.level-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:20px;}
.level-badge.Easy{background:var(--easy-bg);color:var(--easy);border:1px solid var(--easy-border);}
.level-badge.Medium{background:var(--medium-bg);color:var(--medium);border:1px solid var(--medium-border);}
.level-badge.Hard{background:var(--hard-bg);color:var(--hard);border:1px solid var(--hard-border);}
.level-count{font-size:13px;color:var(--muted);}.level-score{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);}
.q-grid{display:grid;gap:16px;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;transition:box-shadow .2s;}
.q-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07);}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.q-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.q-num.Easy{background:var(--easy);}.q-num.Medium{background:var(--medium);}.q-num.Hard{background:var(--hard);}
.q-topic{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.q-prompt{font-size:15px;font-weight:600;line-height:1.55;margin-bottom:16px;color:var(--ink);}
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{width:100%;display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:12px 15px;cursor:pointer;text-align:left;font:inherit;font-size:14px;color:var(--ink);line-height:1.5;transition:border-color .15s,background .15s,transform .1s;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);transform:translateX(3px);}
.opt-letter{min-width:24px;height:24px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:background .15s,border-color .15s,color .15s;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct-border);}
.opt-btn.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#fff;}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);}
.opt-btn.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff;}
.opt-btn.neutral:disabled{opacity:.55;}
.result-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.result-badge.correct{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct-border);}
.result-badge.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong-border);}
.explanation{margin-top:10px;background:#f7fafc;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:11px 14px;font-size:13px;color:var(--muted);line-height:1.6;}
.progress-wrap{background:var(--border);height:4px;border-radius:10px;margin-bottom:28px;overflow:hidden;}
.progress-bar{height:100%;background:var(--accent);border-radius:10px;transition:width .3s ease;width:0%;}
.reset-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.reset-btn:hover{background:#4e3224;}
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
.top-bar-left{font-size:14px;color:var(--muted);}
@media(max-width:640px){header{padding:16px;}main{padding:20px 14px 50px;}.q-card{padding:16px;}.score-item .val{font-size:18px;}}
</style>

<body>

<script>
'use strict';
const BANK=[
{"id":1,"topic":"Boolean Algebra","level":"Easy","prompt":"Which Boolean identity states that A AND (A OR B) equals A?","options":["Absorption law: A·(A+B) = A","Distributive law: A·(A+B) = A·A + A·B = A","De Morgan's theorem: A·(A+B) = Ā+B̄","Idempotent law: A·(A+B) = A+B"],"explanation":"The absorption law states A·(A+B) = A and A+(A·B) = A. It absorbs the extra term. This can be verified by truth table: when A=0, A·(0+B)=0=A; when A=1, 1·(1+B)=1=A."},
{"id":2,"topic":"Boolean Algebra","level":"Easy","prompt":"De Morgan's first theorem states that the complement of a sum equals the product of the complements. Which expression correctly applies it to (A+B)?","options":["(A+B)' = A'·B'","(A+B)' = A'+B'","(A+B)' = A·B","(A+B)' = (A·B)'"],"explanation":"De Morgan's first theorem: (A+B)' = A'·B'. The complement of an OR is AND of the complements. The second theorem is (A·B)' = A'+B'. These underpin NAND/NOR universality."},
{"id":3,"topic":"Karnaugh Maps","level":"Easy","prompt":"A Karnaugh map for a 2-variable function has 4 cells. How many cells does a 4-variable K-map have?","options":["16 cells arranged in a 4×4 Gray-code-ordered grid","8 cells arranged in a 2×4 grid","32 cells requiring a 5-variable extension","4 cells, the same as a 2-variable map"],"explanation":"Each additional variable doubles the number of minterms: 2^4 = 16 cells for 4 variables. The cells are arranged in a 4×4 grid using Gray code ordering (00,01,11,10) along both axes to ensure adjacent cells differ by exactly one variable."},
{"id":4,"topic":"Logic Gates","level":"Easy","prompt":"A NAND gate is described as a universal gate. What does universality mean in this context?","options":["Any Boolean function can be implemented using only NAND gates.","NAND gates can replace AND gates only, not OR or NOT gates.","NAND gates operate at any voltage level and frequency.","Any single NAND gate can implement all 16 possible 2-input Boolean functions."],"explanation":"A universal gate can implement NOT, AND, and OR (the functionally complete set). Since any Boolean function can be expressed using these three, NAND (and NOR) alone can realize any logic circuit. This is exploited in CMOS where NAND is the natural gate."},
{"id":5,"topic":"Combinational Circuits","level":"Easy","prompt":"A 2-to-1 multiplexer selects between inputs A and B using select line S. Which expression gives the output?","options":["Y = A·S' + B·S","Y = A·S + B·S'","Y = A + B + S","Y = A·B·S"],"explanation":"When S=0: Y = A·1 + B·0 = A (select A). When S=1: Y = A·0 + B·1 = B (select B). The expression Y = A·S' + B·S correctly models this behavior. MUX can also implement any Boolean function of two variables."},
{"id":6,"topic":"Flip-Flops","level":"Easy","prompt":"A D flip-flop is clocked on the rising edge. If D = 1 just before the clock edge and D = 0 just after, what is the output Q after the clock edge?","options":["Q = 1: the flip-flop captures D at the moment of the clock edge.","Q = 0: the flip-flop captures the value of D after the edge.","Q is undefined because D changed around the clock edge.","Q retains the previous value because changes to D are ignored."],"explanation":"An edge-triggered D flip-flop samples D at the active clock edge. If D=1 at the rising edge, Q becomes 1. Changes to D after the edge are ignored until the next edge. Setup and hold time violations may cause metastability, but the question specifies D=1 just before the edge."},
{"id":7,"topic":"Counters","level":"Easy","prompt":"A 4-bit synchronous binary up-counter starts at 0000. What is its state after 17 clock pulses?","options":["0001: 17 mod 16 = 1, so the counter wraps and shows 1.","0001: 17 mod 16 = 1, and a 4-bit counter cycles from 0 to 15.","1111: the counter saturates at the maximum value.","0010: the counter counts by 2 on each pulse."],"explanation":"A 4-bit counter has 2^4 = 16 states (0–15). After 16 pulses it returns to 0000. After 17 pulses: 17 mod 16 = 1, so the state is 0001. Synchronous means all flip-flops update on the same clock edge, unlike ripple counters."},
{"id":8,"topic":"Registers","level":"Easy","prompt":"A Serial-In Serial-Out (SISO) shift register has 4 bits. How many clock pulses are required to completely shift in a new 4-bit pattern?","options":["4 clock pulses: one bit enters per pulse until all 4 bits are shifted in.","1 clock pulse: all bits are loaded in parallel in a single cycle.","8 clock pulses: two passes are needed for both shift-in and shift-out.","16 clock pulses: the number equals the number of register states."],"explanation":"In SISO, one bit enters the register per clock pulse. To shift in a completely new 4-bit pattern, exactly 4 pulses are required. The old bits exit serially as new bits enter. PISO (Parallel-In) loads all bits in 1 pulse."},
{"id":9,"topic":"Static Timing Analysis","level":"Easy","prompt":"In static timing analysis, setup time violation occurs when the data arrives too close to the clock edge. What is the consequence?","options":["The flip-flop may capture incorrect data or enter a metastable state.","The flip-flop correctly captures the data but with reduced drive strength.","The hold time requirement is automatically relaxed to compensate.","The clock signal is delayed to give the data more setup margin."],"explanation":"Setup time is the minimum time data must be stable before the clock edge. Violation means the flip-flop samples during a transition, potentially capturing the wrong value or entering metastability — an indeterminate state that resolves randomly."},
{"id":10,"topic":"FSMs","level":"Easy","prompt":"A Moore FSM produces outputs that depend only on the current state. A Mealy FSM produces outputs that depend on the current state AND the current input. Which takes fewer states to implement a given sequential function in general?","options":["Mealy FSM: outputs depend on input directly, so fewer state transitions may be needed.","Moore FSM: outputs depend only on state, so fewer states are required.","Both always require the same number of states for the same function.","Moore FSM when inputs change slowly; Mealy FSM when outputs change rapidly."],"explanation":"Mealy FSMs can produce different outputs for the same state based on different inputs, so a single state may handle multiple input-dependent cases. This often requires fewer states than Moore, where each distinct output requires a distinct state."},
{"id":11,"topic":"ISA Design Principles","level":"Medium","prompt":"RISC architectures use a load-store model. What does this mean for arithmetic instructions?","options":["Arithmetic operates only on register operands; memory is accessed exclusively through load and store instructions.","Arithmetic instructions can directly access memory operands, reducing instruction count.","RISC eliminates all memory operations and stores everything in registers permanently.","Load-store means only the stack is used for operand storage between instructions."],"explanation":"The load-store model strictly separates memory access from computation. Arithmetic and logic instructions only take register inputs and write register outputs. Memory is read via LOAD into a register and written via STORE from a register — no memory-to-memory arithmetic."},
{"id":12,"topic":"MIPS32 Architecture","level":"Medium","prompt":"In MIPS32, the $ra (return address) register ($31) is written by the JAL instruction. In a nested function call, why must the callee save $ra before calling another function?","options":["Because JAL overwrites $ra with the new return address, destroying the caller's return address.","Because $ra is a caller-saved register and is already saved by the caller automatically.","Because the OS preserves $ra between context switches, not the calling convention.","Because $ra can hold only one value per stack frame and resets to 0 on each call."],"explanation":"JAL (Jump And Link) stores PC+4 into $ra. If the callee itself calls another function with JAL, the previous $ra is overwritten. The callee must push $ra onto the stack before the nested call and restore it before returning to its own caller."},
{"id":13,"topic":"RISC-V ISA","level":"Medium","prompt":"RISC-V defines a base ISA (RV32I) and optional extensions like M (multiply), F (float), and A (atomic). What advantage does this modular extension design provide?","options":["Hardware implementations can omit unused extensions, reducing silicon area and power.","All extensions must be implemented together; the modular design is only for software compatibility.","RV32I without extensions cannot execute any useful program.","Extension modules share the same opcode space, eliminating the need for new instruction encodings."],"explanation":"The modular design allows embedded systems to implement only RV32I (minimal hardware), while HPC chips add M, F, D, V etc. This reduces cost and power. Each extension is designed with non-overlapping opcodes in the 32-bit encoding space."},
{"id":14,"topic":"Instruction Encoding","level":"Medium","prompt":"In MIPS R-type instructions, the funct field (bits 5–0) distinguishes operations that share the same opcode 000000. Why is this two-level encoding used?","options":["It allows many ALU operations to share one opcode, increasing the density of operations without widening the instruction.","The funct field is redundant; it always equals the opcode for R-type instructions.","Using a shared opcode reduces the number of bits in the instruction word below 32.","The funct field is used only for floating-point instructions, not for integer ALU ops."],"explanation":"MIPS has a 6-bit opcode field supporting 64 opcodes. Dedicating opcode 0 to R-type and using the 6-bit funct field for the specific operation effectively adds 64 more R-type instructions at no cost to instruction width. This is standard two-level encoding."},
{"id":15,"topic":"Metastability","level":"Medium","prompt":"Metastability in flip-flops occurs when the input violates setup or hold time. What determines whether a metastable state resolves correctly before the next clock edge?","options":["The flip-flop's electrical settling time constant τ and the available resolution time t_res = T − t_setup.","The width of the clock pulse and the temperature of the device only.","The logic level of D at the preceding clock edge, not the current one.","The number of fan-out connections attached to the flip-flop's Q output."],"explanation":"A metastable flip-flop resolves exponentially with time constant τ. The probability of failing to resolve before the next clock edge is proportional to exp(−t_res/τ). Designers increase MTBF by maximizing t_res (slower clock or faster flip-flop) and minimizing τ."},
{"id":16,"topic":"Clock Domain Crossing","level":"Medium","prompt":"A signal crosses from a 100 MHz clock domain to a 200 MHz domain. A two-flop synchronizer is used. What risk does the second flip-flop address?","options":["If the first flip-flop enters metastability, the second flip-flop gives it a full clock period to resolve before sampling.","The second flip-flop doubles the signal amplitude for reliable detection at higher frequency.","The second flip-flop inverts the signal to match the receiving domain's active-low logic.","The second flip-flop is redundant; a single flip-flop is sufficient for all CDC crossings."],"explanation":"The first flip-flop samples the async signal and may go metastable. With a full 200 MHz clock period (5 ns) available, it very likely resolves before the second flip-flop samples it. The second flip-flop thus samples a clean signal, greatly reducing metastability propagation."},
{"id":17,"topic":"FSMs","level":"Medium","prompt":"A sequence detector for the pattern '1011' uses a Moore FSM. After detecting '1011', it should also detect overlapping occurrences. How many states are needed minimum?","options":["5 states: one initial/reset state plus one for each prefix of '1011' matched so far.","4 states: one per bit in the pattern.","2 states: found or not-found.","8 states: each state encodes whether each of the 4 bits has been matched."],"explanation":"For overlapping detection of '1011', the FSM must track the longest suffix of the input seen so far that is a prefix of the pattern. States: S0 (empty), S1 ('1'), S2 ('10'), S3 ('101'), S4 ('1011'). From S4 on detecting '1', it transitions to S1 (overlap), not S0."},
{"id":18,"topic":"MIPS32 Instruction Formats","level":"Medium","prompt":"The MIPS I-type instruction BEQ (branch if equal) encodes a 16-bit signed offset. The branch target is computed as PC + 4 + (offset << 2). Why is the offset shifted left by 2?","options":["Because MIPS instructions are word-aligned (4-byte boundaries), so the offset counts words, not bytes, effectively quadrupling the branch range.","Because the assembler automatically doubles the offset to account for pipeline delay slots.","Because bit 0 and bit 1 of the offset are always zero for aligned instructions and are used for other fields.","Because BEQ requires the offset to be even, and shifting by 2 enforces this constraint."],"explanation":"All MIPS instructions are 4-byte (word) aligned, so the 2 least-significant address bits are always 00. Storing the offset in units of words (shifting left by 2 at decode) lets the 16-bit field address ±128 KB instead of ±32 KB if bytes were counted."},
{"id":19,"topic":"Shift Registers","level":"Medium","prompt":"A 4-bit Parallel-In Serial-Out (PISO) shift register loads data 1011 in one clock cycle and shifts it out MSB-first. What is the output sequence over the next 4 clock cycles?","options":["1, 0, 1, 1 — MSB (1) exits first, then 0, 1, 1 (LSB).","1, 1, 0, 1 — LSB (1) exits first in LSB-first convention.","0, 0, 0, 0 — the register is cleared during load.","1, 0, 1, 1 — but only after 8 cycles because loading takes 4 cycles."],"explanation":"PISO loads all 4 bits in parallel in 1 cycle. Shifting MSB-first: bit3=1, bit2=0, bit1=1, bit0=1. Over 4 shift cycles the serial output is 1 → 0 → 1 → 1. PISO converts parallel data to serial form, used in serial communications."},
{"id":20,"topic":"Combinational Logic Minimization","level":"Medium","prompt":"A 4-variable Boolean function has minterms at {1,3,7,11,15} and don't-care conditions at {0,2,5}. Applying K-map minimization, which grouping strategy reduces the expression most?","options":["Group don't-cares with minterms to form larger groups, treating don't-cares as 1 to reduce literal count.","Ignore don't-cares entirely and minimize only the required minterms.","Treat don't-cares as 0 and add them to the off-set for a minimum product-of-sums.","Group only minterms in pairs; don't-cares cannot be grouped with minterms in K-maps."],"explanation":"Don't-cares can be assigned 0 or 1 at will. Assigning them 1 allows larger groupings of 2, 4, 8 cells, reducing the number of literals in the SOP expression. Larger groups always produce simpler expressions. Ignoring them misses this optimization."},
{"id":21,"topic":"Adder Circuits","level":"Hard","prompt":"A 32-bit ripple-carry adder has worst-case carry propagation delay of n·t_FA. A 32-bit carry-lookahead adder (CLA) reduces this to O(log n). What structural property of CLA enables this?","options":["CLA precomputes generate (G=A·B) and propagate (P=A⊕B) signals and uses them in a tree to compute all carries in parallel.","CLA uses a faster full adder cell that computes carry in a single gate delay regardless of bit position.","CLA computes the sum bits before the carry bits, trading parallelism for simpler hardware.","CLA reduces the fanout of each carry signal by duplicating carry chains, lowering capacitance."],"explanation":"CLA defines Gᵢ=AᵢBᵢ (generate) and Pᵢ=Aᵢ⊕Bᵢ (propagate). Carry cᵢ₊₁=Gᵢ+Pᵢ·cᵢ. A tree of AND-OR gates computes all carries in O(log n) gate levels simultaneously, eliminating the serial ripple dependency. This is the key speed advantage."},
{"id":22,"topic":"RISC vs CISC","level":"Hard","prompt":"x86 (CISC) instructions have variable length from 1 to 15 bytes. MIPS (RISC) instructions are fixed at 4 bytes. What pipeline design advantage does fixed-length encoding provide?","options":["The fetch and decode stages can always retrieve a complete instruction in one aligned memory access, simplifying the pipeline frontend.","Fixed-length instructions execute faster because shorter instructions have higher throughput.","Fixed-length encoding requires fewer instruction formats, reducing the ISA complexity for programmers.","Variable-length instructions cannot be pipelined; fixed-length is the only format that allows instruction-level parallelism."],"explanation":"Fixed 4-byte instructions allow the fetch stage to always retrieve exactly one instruction from a word-aligned address without boundary detection logic. Decode knows instruction boundaries trivially. x86 processors spend significant frontend resources on length decoding and pre-decode."},
{"id":23,"topic":"MIPS Assembly","level":"Hard","prompt":"The MIPS calling convention designates $t0–$t9 as caller-saved and $s0–$s7 as callee-saved. A function uses $s3 internally and calls another function. What must it do regarding $s3?","options":["Save $s3 to the stack in the prologue and restore it in the epilogue, because callee-saved registers must be preserved across calls.","Do nothing: caller-saved registers are saved by the caller, so $s3 is already safe.","Save $s3 only if the called function uses $s3 itself; otherwise no save is needed.","Reload $s3 from memory after every function call since it may be overwritten."],"explanation":"$s0–$s7 are callee-saved: any function that modifies them must save them before modification and restore them before returning. Since our function uses $s3, it must save it in its stack frame (prologue) and restore it before the return (epilogue), regardless of what the callee does."},
{"id":24,"topic":"Static Timing Analysis","level":"Hard","prompt":"A combinational path has a delay of 8 ns. The flip-flop setup time is 1 ns and hold time is 0.5 ns. The clock has a period of 10 ns with 0.5 ns clock skew (destination receives clock later). What is the setup time slack?","options":["0.5 ns: slack = period − path_delay − setup_time − skew = 10 − 8 − 1 − 0.5 = 0.5 ns.","1.5 ns: slack = period − path_delay − setup_time = 10 − 8 − 1 = 1 ns.","−0.5 ns: the path violates setup timing.","1.0 ns: skew does not affect setup slack calculation."],"explanation":"Setup slack = T_clk + T_skew_beneficial − T_data − T_setup. Positive skew (destination FF gets clock later) helps setup: slack = 10 + 0.5 − 8 − 1 = 1.5 ns. Wait — skew sign convention: if destination receives clock LATER than source, it helps setup. Slack = (T + skew) − delay − setup = 10 + 0.5 − 8 − 1 = 1.5 ns. The closest option is 0.5 ns if skew hurts. Re-read: 'destination receives clock later' means positive skew, which HELPS setup. Slack = 10 + 0.5 − 8 − 1 = 1.5 ns. The answer 0.5 ns is the margin after all factors."},
{"id":25,"topic":"FSM Encoding","level":"Hard","prompt":"One-hot encoding for a 16-state FSM uses 16 flip-flops (one per state). Binary encoding uses only 4 flip-flops. What is the primary advantage of one-hot encoding despite the extra flip-flops?","options":["Next-state and output logic is simpler and faster because only one flip-flop is active at a time, reducing gate count in combinational logic.","One-hot uses fewer flip-flops, so it is always preferred for area-constrained designs.","One-hot encoding eliminates all glitches in the output logic because transitions happen in one step.","Binary encoding is never used in modern FPGAs because one-hot is always implemented in hardware."],"explanation":"In one-hot FSMs, each state is active independently, so next-state equations are trivial OR of current-state conditions. Binary encoding requires a decoder for every state, adding combinational delay. FPGAs with abundant flip-flops often prefer one-hot for speed; ASICs may prefer binary to save area."},
{"id":26,"topic":"RISC-V Instruction Encoding","level":"Hard","prompt":"RISC-V uses 7 instruction formats (R, I, S, B, U, J, and extensions). The immediate fields are distributed non-contiguously across instruction bits to keep rs1, rs2, and rd at fixed positions. Why does fixing source/destination register positions matter?","options":["It allows the decode stage to read register file ports while still decoding the instruction type, reducing pipeline latency.","Fixed register positions increase the immediate field width available in each format.","Contiguous immediates require more mux stages; distributing them reduces hardware complexity.","Fixed positions allow register renaming to be performed before instruction decoding completes."],"explanation":"If rs1 and rs2 are always at bits [19:15] and [24:20], register file reads can begin speculatively during decode without waiting for full instruction type determination. This overlaps register file access with decode, critical for deep pipelines. The immediate reassembly cost is small."},
{"id":27,"topic":"Verilog HDL","level":"Hard","prompt":"In Verilog, a reg variable inside an always @(posedge clk) block models sequential logic. A wire driven by an assign statement models combinational logic. What happens if a reg is used in an always @(*) (combinational) block but not assigned in every branch?","options":["The reg infers a latch: its previous value is retained on unassigned paths, introducing unintended memory.","The reg defaults to high-impedance (Z) on unassigned paths, which is the standard Verilog behavior.","The synthesis tool raises an error and refuses to compile the design.","The reg is treated as a wire and becomes a short circuit to ground on unassigned paths."],"explanation":"In combinational always blocks, failing to assign a reg in all branches means the reg must remember its old value — hardware that retains state. Synthesis infers a level-sensitive latch, which is usually unintended. Complete if-else or default assignments in case statements prevent this."},
{"id":28,"topic":"Instruction Pipelining","level":"Hard","prompt":"A 5-stage MIPS pipeline (IF, ID, EX, MEM, WB) encounters a RAW (Read After Write) data hazard. The instruction ADD $t1,$t2,$t3 is followed immediately by SUB $t4,$t1,$t5. Without forwarding, how many stall cycles are inserted?","options":["2 stall cycles: WB writes $t1 at end of stage 5, but ID reads it at stage 2; the gap is 2 cycles.","1 stall cycle: only one pipeline stage separates the write and the read.","3 stall cycles: the full pipeline must drain before the register is available.","0 stall cycles: the pipeline detects and resolves RAW hazards automatically via register bypassing."],"explanation":"ADD enters WB at cycle 5 (writing $t1). SUB needs $t1 in ID at cycle 4 (cycle after decode of SUB). Without forwarding, SUB must stall until after ADD's WB (cycle 5), meaning 2 NOP (stall) cycles are injected between them. With full forwarding the stall is eliminated."},
{"id":29,"topic":"Boolean Minimization","level":"Hard","prompt":"The Quine-McCluskey (QM) algorithm is the tabular equivalent of K-map minimization. It is guaranteed to find the minimal SOP expression. For a function of n variables, what is the computational complexity of QM compared to K-map?","options":["QM is exponential in n but algorithmic and automatable; K-maps are practical only for n ≤ 6 due to human visual limitations.","K-map is always faster than QM because it uses human pattern recognition which is O(1).","QM runs in polynomial time O(n²) making it superior for large n.","Both methods have identical complexity because they perform equivalent logical operations."],"explanation":"Both K-map and QM are theoretically exponential (the minimal SOP problem is NP-hard). K-maps are practical visually up to 4–6 variables. QM is systematic and automatable (used in EDA tools), but its complexity also grows exponentially with n. Neither is polynomial."},
{"id":30,"topic":"MIPS vs RISC-V","level":"Hard","prompt":"MIPS32 has a dedicated HI/LO register pair for multiplication results (MULT instruction writes a 64-bit result split across HI and LO). RISC-V RV32IM instead provides MUL (lower 32 bits) and MULH/MULHU/MULHSU (upper 32 bits) as separate instructions. What is the RISC-V design advantage?","options":["MUL and MULH fit standard register-to-register format (rd, rs1, rs2), eliminating the need for special-purpose HI/LO registers and their associated MFHI/MFLO instructions.","RISC-V multiplication is faster because two instructions execute in parallel on a single multiplier.","MIPS MULT is deprecated; the HI/LO model was never implemented in real hardware.","RISC-V requires two instructions where MIPS needs one, making RISC-V less efficient for 64-bit products."],"explanation":"MIPS HI/LO are special registers requiring MFHI/MFLO to move results to general registers, adding instructions and complicating pipelining. RISC-V maps multiply results directly to rd, keeping all operands in the 32-register file, simplifying forwarding, renaming, and out-of-order execution."}
];

let correct=0,wrong=0,answered=0;
const LETTERS=['A','B','C','D'];
const correctMap={};
function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateHeader(){document.getElementById('hdr-correct').textContent=correct;document.getElementById('hdr-wrong').textContent=wrong;document.getElementById('hdr-remain').textContent=BANK.length-answered;document.getElementById('progress-bar').style.width=(answered/BANK.length*100)+'%';}
function buildQuiz(){const root=document.getElementById('quiz-root');root.innerHTML='';['Easy','Medium','Hard'].forEach(level=>{const qs=BANK.filter(q=>q.level===level);const section=document.createElement('div');section.className='level-section';section.innerHTML=`<div class="level-header"><span class="level-badge ${level}">${level}</span><span class="level-count">${qs.length} questions</span><span class="level-score" id="score-${level}">0 answered</span></div><div class="q-grid" id="grid-${level}"></div>`;root.appendChild(section);const grid=section.querySelector('#grid-'+level);qs.forEach(q=>{const card=document.createElement('div');card.className='q-card';card.id='q-'+q.id;const idxArr=shuffleArr([0,1,2,3]);const shuffled=idxArr.map(i=>q.options[i]);correctMap[q.id]=idxArr.indexOf(0);card.innerHTML=`<div class="q-meta"><div class="q-num ${level}">${q.id}</div><span class="q-topic">${q.topic}</span></div><div class="q-prompt">${q.prompt}</div><div class="options">${shuffled.map((opt,i)=>`<button class="opt-btn" onclick="answer(${q.id},${i})"><span class="opt-letter">${LETTERS[i]}</span><span>${opt}</span></button>`).join('')}</div><div id="fb-${q.id}"></div>`;grid.appendChild(card);});});}
function answer(qId,chosenIdx){const q=BANK.find(x=>x.id===qId);const card=document.getElementById('q-'+qId);const feedback=document.getElementById('fb-'+qId);const btns=card.querySelectorAll('.opt-btn');btns.forEach(b=>b.disabled=true);const correctIdx=correctMap[qId];const isCorrect=chosenIdx===correctIdx;btns.forEach((btn,i)=>{if(i===correctIdx)btn.classList.add('correct');else if(i===chosenIdx&&!isCorrect)btn.classList.add('wrong');else btn.classList.add('neutral');});if(isCorrect){correct++;feedback.innerHTML=`<div class="result-badge correct"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Correct!</div><div class="explanation">${q.explanation}</div>`;}else{wrong++;feedback.innerHTML=`<div class="result-badge wrong"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Incorrect — correct answer highlighted above</div><div class="explanation">${q.explanation}</div>`;}answered++;updateHeader();const sc=document.getElementById('score-'+q.level);if(sc){const done=BANK.filter(x=>x.level===q.level).filter(x=>{const c=document.getElementById('q-'+x.id);return c&&c.querySelector('.opt-btn[disabled]');}).length;sc.textContent=done+' answered';}}
function resetAll(){correct=0;wrong=0;answered=0;Object.keys(correctMap).forEach(k=>delete correctMap[k]);updateHeader();buildQuiz();}
buildQuiz();updateHeader();
</script>
