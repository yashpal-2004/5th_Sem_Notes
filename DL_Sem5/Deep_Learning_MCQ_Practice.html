<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link class="favicon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2312695e%22/><text x=%2250%22 y=%2250%22 font-family=%22Arial%22 font-size=%2245%22 fill=%22white%22 font-weight=%22bold%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>DL</text></svg>" rel="icon"/>
<title>Deep Learning · MCQ Practice Lab</title>
<style>
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --border: #e2e8ee;
  --ink: #1a2733;
  --muted: #5a6b78;
  --accent: #12695e;
  --accent-light: #eaf4f1;
  --easy: #1a7a4e;
  --easy-bg: #eaf5ef;
  --easy-border: #b7dfca;
  --medium: #c47a16;
  --medium-bg: #fef8ec;
  --medium-border: #f0d9a0;
  --hard: #b03535;
  --hard-bg: #fef0f0;
  --hard-border: #f5bfbf;
  --correct: #1a7a4e;
  --correct-bg: #eaf5ef;
  --correct-border: #34784a;
  --wrong: #b03535;
  --wrong-bg: #fef0f0;
  --wrong-border: #c95555;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.65 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}
/* ── HEADER ── */
header {
  background: #0f2e28;
  color: #fff;
  padding: 22px max(20px, calc((100% - 1100px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}
.header-left h1 { font-size: clamp(18px, 3vw, 24px); font-weight: 700; letter-spacing: -.3px; }
.header-left p  { font-size: 12px; color: #9eccc5; margin-top: 2px; }
.score-box {
  display: flex; gap: 20px; align-items: center;
}
.score-item {
  text-align: center;
}
.score-item .val { font-size: 22px; font-weight: 800; line-height: 1; }
.score-item .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #9eccc5; margin-top: 2px; }
.score-item.correct .val { color: #5de0b8; }
.score-item.wrong   .val { color: #f4897a; }
.score-item.remain  .val { color: #e5d97e; }
/* ── LAYOUT ── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}
/* ── SECTION GROUPS ── */
.level-section { margin-bottom: 40px; }
.level-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.level-badge {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; padding: 4px 12px; border-radius: 20px;
}
.level-badge.Easy   { background: var(--easy-bg);   color: var(--easy);   border: 1px solid var(--easy-border); }
.level-badge.Medium { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium-border); }
.level-badge.Hard   { background: var(--hard-bg);   color: var(--hard);   border: 1px solid var(--hard-border); }
.level-count { font-size: 13px; color: var(--muted); }
.level-score { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); }
/* ── QUESTION CARDS ── */
.q-grid {
  display: grid;
  gap: 16px;
}
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px 24px;
  transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
.q-meta {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.q-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
  color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.q-num.Easy   { background: var(--easy); }
.q-num.Medium { background: var(--medium); }
.q-num.Hard   { background: var(--hard); }
.q-topic { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.q-prompt {
  font-size: 15px; font-weight: 600; line-height: 1.55;
  margin-bottom: 16px; color: var(--ink);
}
/* ── OPTIONS ── */
.options { display: flex; flex-direction: column; gap: 9px; }
.opt-btn {
  width: 100%;
  display: flex; align-items: flex-start; gap: 12px;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 9px; padding: 12px 15px;
  cursor: pointer; text-align: left;
  font: inherit; font-size: 14px; color: var(--ink);
  line-height: 1.5;
  transition: border-color .15s, background .15s, transform .1s;
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateX(3px);
}
.opt-letter {
  min-width: 24px; height: 24px; border-radius: 5px;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  transition: background .15s, border-color .15s, color .15s;
}
.opt-btn:disabled { cursor: default; }
/* States after answering */
.opt-btn.correct {
  background: var(--correct-bg);
  border-color: var(--correct-border);
}
.opt-btn.correct .opt-letter {
  background: var(--correct); border-color: var(--correct); color: #fff;
}
.opt-btn.wrong {
  background: var(--wrong-bg);
  border-color: var(--wrong-border);
}
.opt-btn.wrong .opt-letter {
  background: var(--wrong); border-color: var(--wrong); color: #fff;
}
.opt-btn.neutral:disabled {
  opacity: .55;
}
/* ── RESULT BADGE ── */
.result-badge {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px; padding: 8px 14px;
  border-radius: 8px; font-size: 13px; font-weight: 600;
}
.result-badge.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct-border); }
.result-badge.wrong   { background: var(--wrong-bg);   color: var(--wrong);   border: 1px solid var(--wrong-border); }
.result-badge svg { flex-shrink: 0; }
.explanation {
  margin-top: 10px;
  background: #f7fafc;
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  padding: 11px 14px;
  font-size: 13px; color: var(--muted); line-height: 1.6;
}
/* ── PROGRESS BAR ── */
.progress-wrap {
  background: var(--border); height: 4px; border-radius: 10px;
  margin-bottom: 28px; overflow: hidden;
}
.progress-bar {
  height: 100%; background: var(--accent);
  border-radius: 10px; transition: width .3s ease;
  width: 0%;
}
/* ── RESET BUTTON ── */
.reset-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  padding: 10px 20px; font: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background .15s;
}
.reset-btn:hover { background: #0c5148; }
.top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.top-bar-left { font-size: 14px; color: var(--muted); }
@media (max-width: 640px) {
  header { padding: 16px 16px; }
  main { padding: 20px 14px 50px; }
  .q-card { padding: 16px 16px; }
  .score-item .val { font-size: 18px; }
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Deep Learning · MCQ Practice Lab</h1>
    <p>30 questions · Instant answer reveal · B.Tech Self-assessment</p>
  </div>
  <div class="score-box">
    <div class="score-item correct">
      <div class="val" id="hdr-correct">0</div>
      <div class="lbl">Correct</div>
    </div>
    <div class="score-item wrong">
      <div class="val" id="hdr-wrong">0</div>
      <div class="lbl">Wrong</div>
    </div>
    <div class="score-item remain">
      <div class="val" id="hdr-remain">30</div>
      <div class="lbl">Left</div>
    </div>
  </div>
</header>

<main>
  <div class="top-bar">
    <div class="top-bar-left">Click any option to reveal the answer immediately.</div>
    <button class="reset-btn" onclick="resetAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
      Reset All
    </button>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div id="quiz-root"></div>
</main>

<script>
'use strict';
const BANK=[{"id":1,"topic":"Forward Pass + Backpropagation","level":"Easy","prompt":"A model produces predictions and a loss, but the programmer has not called backward() or optimizer.step(). What has happened so far?","options":["A forward computation occurred; the parameters have not been updated.","A backward computation occurred; the gradients have already changed the parameters.","A parameter update occurred; backward() will measure its effect.","A loss computation occurred; the optimizer has already selected new parameter values."],"explanation":"The forward pass computes predictions and loss using the current parameters. backward() computes gradients, while optimizer.step() performs the parameter update. A loss value alone does not trigger either operation."},{"id":2,"topic":"Stochastic Gradient Descent (SGD)","level":"Easy","prompt":"Single-example SGD gives a noisy training-loss curve, but the average loss across many updates decreases. What is the best interpretation?","options":["Different examples yield noisy gradients while overall learning can still progress.","Every upward movement means the optimizer has entered a worse local minimum.","The learning rate must be reduced after each individual increase in the training-loss curve.","The model has started overfitting because consecutive training losses differ."],"explanation":"Single-example gradients vary with the sampled example, so individual updates need not reduce the loss on every example. Assess the overall trend and validation behavior before diagnosing failure or overfitting."},{"id":3,"topic":"Mini-batch Gradient Descent + DataLoader","level":"Easy","prompt":"A Dataset is sorted by class. Why would a learner typically use shuffle=True in the training DataLoader?","options":["To mix class order across mini-batches and reduce dependence on the sorted sequence.","To guarantee that every mini-batch contains exactly the same number of samples per class.","To increase the number of training examples available in each epoch.","To change image-label pairings so the model cannot memorize the original sample order."],"explanation":"Shuffling changes sample order while keeping each image paired with its label. It reduces systematic ordering effects but does not guarantee class-balanced batches or create new data."},{"id":4,"topic":"CNN Filters + Feature Maps","level":"Easy","prompt":"An early CNN filter responds strongly to vertical edges in different image locations. What explains this behavior?","options":["The same learned filter weights are applied at different spatial locations.","Each spatial location stores its own independently trained copy of that edge filter.","The pooling layer first moves all vertical edges to a common location.","The filter's output channel determines the image location where the edge is allowed to appear."],"explanation":"Convolution shares a filter's weights across spatial positions. The resulting feature map records where that filter responds. Different output channels use different learned filters; they are not assigned to fixed image locations."},{"id":5,"topic":"Stride + Padding","level":"Easy","prompt":"An image classifier must keep the first convolution's feature-map size equal to the input size. It uses a 3×3 kernel and dilation 1. Which setting works?","options":["Stride 1 with one pixel of padding on each side.","Stride 2 with one pixel of padding on each side of the input.","Stride 1 without adding any padding.","Stride 2 with no padding around the original input image."],"explanation":"A 3×3 kernel at stride 1 removes two positions per axis unless padding compensates. One pixel on each side preserves the size. Padding and stride have different roles; stride 2 downsamples."},{"id":6,"topic":"Pooling","level":"Easy","prompt":"After max pooling, a learner cannot reconstruct the exact locations and values of all activations in each window from the pooled output alone. Why?","options":["Each window keeps its maximum and discards the remaining activation details.","Each window keeps its mean and discards only the original ordering of values.","Each window learns a smaller image that preserves its complete local information.","Each window retains every activation but stores them in a different channel order."],"explanation":"Standard max pooling retains only the maximum value from each window. Several different windows can produce the same output, so it loses information. It does not compute an average or learn a compressed representation."},{"id":7,"topic":"Underfitting","level":"Easy","prompt":"A model performs poorly on both training and validation data. Which conclusion is most defensible before further checks?","options":["Underfitting is possible, but optimization and data quality also need investigation.","Overfitting is established because the model has already seen the training data.","Insufficient model capacity is proved, so adding layers is the only useful next experiment.","The validation split is the cause because it contains previously unseen examples."],"explanation":"Poor training and validation performance is consistent with underfitting, but it does not identify a unique cause. Limited capacity, failed optimization, excessive regularization, or data problems can produce this pattern."},{"id":8,"topic":"Overfitting","level":"Easy","prompt":"Training performance keeps improving while validation performance worsens over several epochs. What does this pattern most strongly suggest?","options":["The model is fitting training-specific details that do not generalize well.","The model needs more capacity to explain the remaining training examples.","The validation set has become harder because its examples change after every optimizer update.","The model has reached the best achievable performance on both datasets."],"explanation":"The divergence suggests overfitting. It supports evaluating measures such as early stopping or regularization. Validation performance does not worsen simply because examples are unseen, and this pattern does not establish an optimal model."},{"id":9,"topic":"Dropout","level":"Easy","prompt":"A learner wants to explain what dropout does during training. Which description is accurate?","options":["It randomly masks activations on each pass, reducing reliance on particular activation combinations.","It permanently removes weak connections after comparing their learned weight magnitudes.","It randomly removes training examples from each batch before computing the network's prediction error.","It replaces small activations with their average so all hidden units receive similar values."],"explanation":"Dropout masks activations during training rather than permanently pruning weights or discarding examples. Changing the active combinations can reduce co-adaptation. Ordinary dropout is disabled in evaluation mode."},{"id":10,"topic":"NN.Module","level":"Easy","prompt":"A learner defines self.fc = nn.Linear(...) inside a custom nn.Module after calling super().__init__(). Why is this useful?","options":["It registers the layer so model.parameters() can expose its trainable parameters.","It runs the layer once so its gradients are available before training begins.","It registers the layer and automatically inserts it into every future forward computation.","It selects an optimizer for the layer according to the number of output features."],"explanation":"Assigning the layer as an attribute registers it as a child module. This supports parameter discovery, state saving, and device movement. The learner still defines forward() and chooses the optimizer."},{"id":11,"topic":"Implement SGD and Mini-batches","level":"Medium","prompt":"A loop starts with cleared gradients. For every batch it runs forward, backward, and step(), but never clears gradients again. Ordinary independent mini-batch updates were intended. What is the main problem?","options":["Later updates use accumulated gradients instead of only the current batch's gradient.","Later batches replace previous gradients, so only the final example affects each update.","Later updates reuse the first batch's gradient because step() prevents gradients from changing.","Later batches change the learning rate because gradient storage is shared across updates."],"explanation":"PyTorch accumulates into gradient buffers when backward() is called. optimizer.step() does not clear them. For ordinary mini-batch training, clear gradients before the next backward pass, commonly at the start of each iteration."},{"id":12,"topic":"Learning Rate Scheduling","level":"Medium","prompt":"Training loss still trends downward but repeatedly overshoots, and gradient measurements show unusually large update steps. Which first adjustment most directly targets this behavior?","options":["Reduce the learning rate and check whether the updates become more stable.","Increase dropout and check whether the training-validation gap becomes smaller.","Stop at the current checkpoint because a fluctuating loss proves that training has finished.","Increase network width and check whether extra parameters absorb the large updates."],"explanation":"A smaller learning rate directly reduces update size. The evidence points toward optimization instability rather than establishing overfitting or insufficient capacity. A schedule can reduce the rate as training progresses, but its effect should be checked."},{"id":13,"topic":"Early Stopping","level":"Medium","prompt":"A team wants to choose its early-stopping checkpoint using test accuracy because the test set is larger. What is the strongest objection?","options":["Repeated checkpoint selection would use test information to influence the final model.","Test accuracy is unsuitable because early stopping must always monitor training loss.","A larger test set makes every checkpoint appear equally accurate during training.","Checkpoint selection on the test set is valid whenever gradients are computed only on training data."],"explanation":"Test data should provide an independent final evaluation. Using it repeatedly to choose a checkpoint makes it part of model selection even without computing gradients on it. Use validation data for stopping decisions."},{"id":14,"topic":"L1 + L2 Regularization","level":"Medium","prompt":"A team compares penalties to encourage sparse weights, rather than merely keeping many weights small. Which choice best matches that aim?","options":["L1, because its absolute-value penalty promotes sparse solutions.","L2, because its squared-weight penalty forces more small weights to become exactly zero.","L1, because its penalty is differentiable at zero.","L2, because penalizing large weights is equivalent to removing weak connections."],"explanation":"L1 promotes sparsity through its absolute-value penalty. L2 generally shrinks weights without specifically promoting exact zeros. Exact sparsity also depends on the optimization method; L1 does not guarantee that ordinary gradient steps will set weights to zero."},{"id":15,"topic":"Batch Normalization","level":"Medium","prompt":"A CNN uses BatchNorm2d after convolution. A learner proposes one mean across every channel because the channels belong to the same image batch. What is the correct interpretation?","options":["Each channel has separate statistics computed across batch and spatial positions.","Each image has separate statistics computed across its channels and spatial positions.","Each spatial position has separate statistics computed across channels only.","All channels share batch statistics, but learned scale and shift parameters later restore their original distributions."],"explanation":"BatchNorm2d computes training statistics separately for each channel over batch, height, and width. Learned per-channel scale and shift do not turn a single global normalization into the standard BatchNorm operation."},{"id":16,"topic":"Adam","level":"Medium","prompt":"Adam initially trains faster than SGD on a task. Which conclusion is justified?","options":["Adaptive updates helped this run; final validation performance still needs comparison.","Its adaptive updates guarantee better final generalization on the same task.","Its initial progress shows that learning-rate tuning is unnecessary for the remaining training.","Its faster progress establishes that the SGD model has insufficient representational capacity."],"explanation":"Adam adapts updates using gradient histories. Faster initial optimization does not establish better final generalization or remove the need to tune hyperparameters. Optimizer choice does not itself change the model's representational capacity."},{"id":17,"topic":"Constant Initialization","level":"Medium","prompt":"Two hidden neurons have identical incoming weights, biases, and symmetric outgoing connections. They receive identical updates. Why can training fail to make them specialize?","options":["The parameter symmetry makes the neurons follow the same learning trajectory.","The learning rate is shared, so even independently initialized neurons must remain identical.","The loss is averaged, so all hidden neurons must receive the same gradient.","The activation function is nonlinear, so different neurons cannot learn different features."],"explanation":"Under the stated symmetry, the neurons compute the same functions and receive matching updates. Independent weight initialization can break this symmetry. Sharing a learning rate or averaging a loss does not generally force all neurons to behave identically."},{"id":18,"topic":"Random Initialization","level":"Medium","prompt":"A deep sigmoid network uses independent random weights, yet most units begin near saturation. What does this reveal about initialization?","options":["Breaking symmetry is insufficient; weight scale must also support useful signal propagation.","Independent random weights are unsuitable; all hidden weights should use one shared constant.","Saturation means the random seed is wrong and should be changed until the first loss is small.","The bias terms are unnecessary because randomized weights already control every activation value."],"explanation":"Randomness breaks symmetry, but unsuitable scale can produce large pre-activations and small sigmoid derivatives. Layer widths and activation behavior matter. Merely changing the seed or using a shared constant does not address the scaling principle."},{"id":19,"topic":"He + Xavier Initialization","level":"Medium","prompt":"A learner replaces tanh hidden activations with ReLU. Why should the weight initializer be reconsidered?","options":["ReLU changes signal propagation; He scaling is designed to account for its rectification.","Initialization depends only on matrix dimensions, so changing activations cannot affect its suitability.","Xavier and He differ only in their random seeds.","ReLU removes negative outputs, so the initializer should compensate by using positive weights exclusively."],"explanation":"Initialization scale depends on how activations transform signals and gradients. He initialization is designed for rectifiers, while Xavier balances fan-in and fan-out. ReLU does not require exclusively positive weights."},{"id":20,"topic":"Bias-Variance Tradeoff","level":"Medium","prompt":"Across repeated training sets, a large network fits each set closely but changes its predictions substantially. A regularized version is more stable but fits the training sets less closely. What tradeoff is suggested?","options":["Reduced prediction variance at the cost of a more constrained fit.","Reduced approximation bias at the cost of greater prediction variance.","Reduced variance with proof that held-out error must improve on every dataset.","Increased variance because the regularized model has a higher training error."],"explanation":"Greater stability across training sets suggests lower variance. Restricting the fit can increase bias. Whether total held-out error improves must be measured; training error alone is not a measure of prediction variance."},{"id":21,"topic":"Receptive Field + Pooling","level":"Hard","prompt":"A CNN recognizes small textures but struggles when the label depends on distant parts of the image. Increasing channels in the same local stack did not help. Which experiment most directly tests limited receptive field as a cause?","options":["Expand spatial context with deeper or dilated convolutions while monitoring lost detail.","Increase channels again while preserving the same receptive field and classifier connections.","Reduce weight decay while keeping the spatial architecture unchanged.","Replace the classifier with fewer outputs while leaving the image regions available to it unchanged."],"explanation":"A receptive-field hypothesis concerns which input regions can influence a representation. Deeper or dilated convolutions can expand that context. More channels provide more local features without necessarily expanding spatial reach."},{"id":22,"topic":"Translation Invariance","level":"Hard","prompt":"A classifier uses stride-1 convolution followed by stride-2 max pooling. Without boundary effects, a one-pixel input shift changes its prediction. Which explanation should be investigated first?","options":["Pooling windows can regroup shifted activations, so convolutional equivariance does not ensure invariant predictions.","Convolution must have stopped sharing weights because shared weights guarantee an unchanged prediction after every shift.","The shift must have changed the image label, since pooling preserves all local information.","The learned filters must have changed during evaluation because the same image content produced different outputs."],"explanation":"Stride-1 convolution can shift its feature maps with the input, but pooling on a fixed downsampling grid can group those responses differently. Equivariance of an operation is not invariance of the complete classifier."},{"id":23,"topic":"AlexNet + VGG","level":"Hard","prompt":"A team replaces one large convolution with stacked smaller convolutions and intervening activations, following a VGG-style design. Even when the receptive fields match, why are the two designs not generally equivalent?","options":["The stack adds nonlinear transformations and imposes a different parameterization.","The stack must compute the same function because its receptive field is unchanged.","The stack differs only in execution speed because all extra activations can be absorbed into one linear kernel.","The stack must use more parameters because depth alone determines total parameter count."],"explanation":"Matching receptive fields means access to the same spatial extent, not identical computation. Intermediate nonlinearities and parameterization change the represented functions. Parameter counts depend on widths and kernel sizes as well as depth."},{"id":24,"topic":"Shattered Gradients + Residual Connections","level":"Hard","prompt":"Gradient norms remain stable as a plain network gets deeper, but optimization worsens. Which additional finding would support gradient shattering over a simple vanishing-gradient explanation?","options":["Gradients for nearby inputs lose correlation as depth increases.","Training loss varies from one randomly sampled mini-batch to another.","The gradients become uniformly smaller at every layer as network depth increases.","Validation loss rises while training loss continues falling, with no change in gradient correlation."],"explanation":"Shattering concerns loss of gradient correlation and structure across nearby inputs. Stable norms weaken a simple vanishing-magnitude explanation but do not exclude shattering. Ordinary batch noise or an overfitting gap alone does not establish it."},{"id":25,"topic":"Residual Connections + ResNet","level":"Hard","prompt":"A residual block computes y=x+F(x). During training, its residual branch learns a correction close to zero. What should be inferred about this block?","options":["It can preserve the incoming representation without the branch learning an identity mapping.","It must remove most input information because the branch output is near zero.","It must reproduce the original image because every shortcut bypasses all earlier feature extraction.","It has become useless because a useful residual branch must produce larger values than the shortcut."],"explanation":"When F(x) is near zero, y is near x. The shortcut carries the block's incoming representation, which may already be a feature tensor rather than the original image. Preserving an adequate representation can be useful."},{"id":26,"topic":"Inception Networks","level":"Hard","prompt":"An image task contains both fine textures and larger patterns. A team considers parallel branches with different receptive fields, then channel concatenation. Why use this design rather than simply add more filters of one size?","options":["It makes features from different spatial scales available at the same stage.","It guarantees that each branch specializes in a different object class.","It combines multiple branches into one feature map by averaging their channel responses.","It guarantees scale-invariant predictions because different kernel sizes see different portions of the image."],"explanation":"Inception-style branches offer multiple receptive-field scales before their features are concatenated. More filters of one size can learn more patterns at that scale but do not provide the same explicit multiscale design."},{"id":27,"topic":"Double Descent","level":"Hard","prompt":"A width sweep shows test error decreasing, rising near interpolation, then decreasing again. The widest model also received many more optimization steps. What should the team do before attributing the pattern to model size?","options":["Repeat under a controlled training protocol and report both training and held-out errors.","Conclude that increasing width beyond interpolation will always improve generalization.","Compare only the models with zero training error and discard every smaller model from the analysis.","Keep the unequal training schedules because model capacity and optimization time represent the same experimental variable."],"explanation":"Model size and optimization progress can both affect performance. Control or explicitly study the training schedule, use repeated seeds, and report training and held-out errors."},{"id":28,"topic":"Gradient Accumulation + Batch Normalization","level":"Hard","prompt":"A team replaces a batch of 64 with four micro-batches of 16, scales losses correctly, and updates once. BatchNorm remains in training mode for every forward pass. Why may the results still differ?","options":["BatchNorm uses each micro-batch's statistics, changing the forward computations.","Accumulation makes SGD update four times even when step() is called only once.","Correct loss scaling guarantees equivalence, so any difference must come from a software error.","BatchNorm combines the four forward passes into one set of training statistics before backward() runs."],"explanation":"Correct scaling aligns mean-loss gradient weighting, but it does not make batch-dependent forward passes identical. BatchNorm normalizes each micro-batch using its own statistics and updates running statistics on each call."},{"id":29,"topic":"Batch Normalization + Dropout","level":"Hard","prompt":"Validation is run under no_grad() while the model remains in train mode. Predictions vary between repeated passes, and BatchNorm running statistics change. Which response addresses both observations?","options":["Use eval mode during validation and restore train mode before training resumes.","Freeze parameter gradients while leaving all modules in train mode.","Use eval mode permanently for both validation and training so the layer behavior never changes again.","Increase validation batch size while retaining training-mode dropout and BatchNorm behavior."],"explanation":"no_grad() stops gradient recording but does not change module mode. Evaluation mode disables standard dropout sampling and makes BatchNorm use its running statistics. Returning to training mode restores their intended training behavior."},{"id":30,"topic":"Regularization + Model Selection","level":"Hard","prompt":"Increasing dropout lowers training accuracy and improves validation accuracy across repeated runs. A colleague says this proves that still more dropout will improve the model. What is the strongest response?","options":["The tested increase helped generalization; further increases may cause underfitting and need validation.","The lower training accuracy proves the new model is worse despite its validation results.","The validation improvement proves that stronger dropout will keep reducing variance without increasing bias.","The next dropout rate should be selected using test accuracy to avoid relying on the same validation set."],"explanation":"The evidence supports the tested change, not a monotonic benefit from stronger regularization. Excessive dropout can limit useful learning and cause underfitting. Compare candidate rates using validation data while keeping the test set independent."}];

let correct=0,wrong=0,answered=0;
const LETTERS=['A','B','C','D'];
const correctMap={};
function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateHeader(){document.getElementById('hdr-correct').textContent=correct;document.getElementById('hdr-wrong').textContent=wrong;document.getElementById('hdr-remain').textContent=BANK.length-answered;document.getElementById('progress-bar').style.width=(answered/BANK.length*100)+'%';}
function buildQuiz(){const root=document.getElementById('quiz-root');root.innerHTML='';['Easy','Medium','Hard'].forEach(level=>{const qs=BANK.filter(q=>q.level===level);const section=document.createElement('div');section.className='level-section';section.innerHTML=`<div class="level-header"><span class="level-badge ${level}">${level}</span><span class="level-count">${qs.length} questions</span><span class="level-score" id="score-${level}">0 answered</span></div><div class="q-grid" id="grid-${level}"></div>`;root.appendChild(section);const grid=section.querySelector('#grid-'+level);qs.forEach(q=>{const card=document.createElement('div');card.className='q-card';card.id='q-'+q.id;const idxArr=shuffleArr([0,1,2,3]);const shuffled=idxArr.map(i=>q.options[i]);correctMap[q.id]=idxArr.indexOf(0);card.innerHTML=`<div class="q-meta"><div class="q-num ${level}">${q.id}</div><span class="q-topic">${q.topic}</span></div><div class="q-prompt">${q.prompt}</div><div class="options">${shuffled.map((opt,i)=>`<button class="opt-btn" onclick="answer(${q.id},${i})"><span class="opt-letter">${LETTERS[i]}</span><span>${opt}</span></button>`).join('')}</div><div id="fb-${q.id}"></div>`;grid.appendChild(card);});});}
function answer(qId,chosenIdx){const q=BANK.find(x=>x.id===qId);const card=document.getElementById('q-'+qId);const feedback=document.getElementById('fb-'+qId);const btns=card.querySelectorAll('.opt-btn');btns.forEach(b=>b.disabled=true);const correctIdx=correctMap[qId];const isCorrect=chosenIdx===correctIdx;btns.forEach((btn,i)=>{if(i===correctIdx)btn.classList.add('correct');else if(i===chosenIdx&&!isCorrect)btn.classList.add('wrong');else btn.classList.add('neutral');});if(isCorrect){correct++;feedback.innerHTML=`<div class="result-badge correct"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Correct!</div><div class="explanation">${q.explanation}</div>`;}else{wrong++;feedback.innerHTML=`<div class="result-badge wrong"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Incorrect — correct answer highlighted above</div><div class="explanation">${q.explanation}</div>`;}answered++;updateHeader();const sc=document.getElementById('score-'+q.level);if(sc){const done=BANK.filter(x=>x.level===q.level).filter(x=>{const c=document.getElementById('q-'+x.id);return c&&c.querySelector('.opt-btn[disabled]');}).length;sc.textContent=done+' answered';}}
function resetAll(){correct=0;wrong=0;answered=0;Object.keys(correctMap).forEach(k=>delete correctMap[k]);updateHeader();buildQuiz();}
buildQuiz();updateHeader();
</script>
