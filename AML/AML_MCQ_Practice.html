<title>Advanced Machine Learning · MCQ Practice Lab</title>
<style>
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --border: #e2e8ee;
  --ink: #1a2733;
  --muted: #5a6b78;
  --accent: #365584;
  --accent-light: #ecf2fa;
  --easy: #1a7a4e;
  --easy-bg: #eaf5ef;
  --easy-border: #b7dfca;
  --medium: #c47a16;
  --medium-bg: #fef8ec;
  --medium-border: #f0d9a0;
  --hard: #b03535;
  --hard-bg: #fef0f0;
  --hard-border: #f5bfbf;
  --correct: #1a7a4e;
  --correct-bg: #eaf5ef;
  --correct-border: #34784a;
  --wrong: #b03535;
  --wrong-bg: #fef0f0;
  --wrong-border: #c95555;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; }
header { background: #162238; color: #fff; padding: 22px max(20px, calc((100% - 1100px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
.header-left h1 { font-size: clamp(18px, 3vw, 24px); font-weight: 700; letter-spacing: -.3px; }
.header-left p  { font-size: 12px; color: #a8bcd8; margin-top: 2px; }
.score-box { display: flex; gap: 20px; align-items: center; }
.score-item { text-align: center; }
.score-item .val { font-size: 22px; font-weight: 800; line-height: 1; }
.score-item .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #a8bcd8; margin-top: 2px; }
.score-item.correct .val { color: #5de0b8; }
.score-item.wrong   .val { color: #f4897a; }
.score-item.remain  .val { color: #e5d97e; }
main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
.level-section { margin-bottom: 40px; }
.level-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
.level-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 4px 12px; border-radius: 20px; }
.level-badge.Easy   { background: var(--easy-bg);   color: var(--easy);   border: 1px solid var(--easy-border); }
.level-badge.Medium { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium-border); }
.level-badge.Hard   { background: var(--hard-bg);   color: var(--hard);   border: 1px solid var(--hard-border); }
.level-count { font-size: 13px; color: var(--muted); }
.level-score { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); }
.q-grid { display: grid; gap: 16px; }
.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; transition: box-shadow .2s; }
.q-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
.q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.q-num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.q-num.Easy { background: var(--easy); } .q-num.Medium { background: var(--medium); } .q-num.Hard { background: var(--hard); }
.q-topic { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.q-prompt { font-size: 15px; font-weight: 600; line-height: 1.55; margin-bottom: 16px; color: var(--ink); }
.options { display: flex; flex-direction: column; gap: 9px; }
.opt-btn { width: 100%; display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1.5px solid var(--border); border-radius: 9px; padding: 12px 15px; cursor: pointer; text-align: left; font: inherit; font-size: 14px; color: var(--ink); line-height: 1.5; transition: border-color .15s, background .15s, transform .1s; }
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); transform: translateX(3px); }
.opt-letter { min-width: 24px; height: 24px; border-radius: 5px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; transition: background .15s, border-color .15s, color .15s; }
.opt-btn:disabled { cursor: default; }
.opt-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); }
.opt-btn.correct .opt-letter { background: var(--correct); border-color: var(--correct); color: #fff; }
.opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
.opt-btn.wrong .opt-letter { background: var(--wrong); border-color: var(--wrong); color: #fff; }
.opt-btn.neutral:disabled { opacity: .55; }
.result-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.result-badge.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct-border); }
.result-badge.wrong   { background: var(--wrong-bg);   color: var(--wrong);   border: 1px solid var(--wrong-border); }
.explanation { margin-top: 10px; background: #f7fafc; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 11px 14px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.progress-wrap { background: var(--border); height: 4px; border-radius: 10px; margin-bottom: 28px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 10px; transition: width .3s ease; width: 0%; }
.reset-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
.reset-btn:hover { background: #2a456e; }
.top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.top-bar-left { font-size: 14px; color: var(--muted); }
@media (max-width: 640px) { header { padding: 16px; } main { padding: 20px 14px 50px; } .q-card { padding: 16px; } .score-item .val { font-size: 18px; } }
</style>

<script>
'use strict';
const BANK=[
{"id":1,"topic":"ML Project Lifecycle","level":"Easy","prompt":"During the problem framing phase of an ML project lifecycle, which activity takes the highest priority before collecting any data?","options":["Defining the success metric and business objective that the model must optimize.","Selecting the algorithm family based on known computational constraints.","Splitting available data into training and validation sets.","Choosing a regularization strategy to prevent overfitting."],"explanation":"Problem framing anchors every subsequent decision. Without a clear success metric (e.g., minimize RMSE, maximize recall), it is impossible to evaluate whether any model, data choice, or regularization strategy is appropriate."},
{"id":2,"topic":"ML Project Lifecycle","level":"Easy","prompt":"In the model deployment phase of the ML lifecycle, which concern is most specific to this phase and not to earlier phases?","options":["Monitoring for data drift that degrades live performance over time.","Tuning hyperparameters to reduce validation loss.","Engineering features from raw data sources.","Splitting data to avoid leakage between training and evaluation."],"explanation":"Data drift — the shift in input distribution between training time and serving time — only becomes observable after deployment. Hyperparameter tuning, feature engineering, and data splitting all belong to earlier phases."},
{"id":3,"topic":"Simple Linear Regression (OLS)","level":"Easy","prompt":"In OLS simple linear regression, what condition on the residuals is required for the OLS estimator to be the Best Linear Unbiased Estimator (BLUE)?","options":["Residuals have zero mean, constant variance, and are uncorrelated.","Residuals follow a normal distribution with non-zero mean.","Residuals are correlated with the predictor variable.","Residuals have variance that increases with fitted values."],"explanation":"The Gauss-Markov theorem guarantees BLUE status when residuals are zero-mean, homoscedastic (constant variance), and uncorrelated. Normality is needed for inference (t-tests) but not for the BLUE property itself."},
{"id":4,"topic":"Multiple Linear Regression (OLS)","level":"Easy","prompt":"In multiple linear regression using OLS, the closed-form solution is β = (XᵀX)⁻¹Xᵀy. When does this formula fail to produce a unique solution?","options":["When two or more predictor columns are perfectly linearly dependent (perfect multicollinearity).","When the response variable y is non-normally distributed.","When the number of observations exceeds the number of predictors.","When the predictors have been standardized to zero mean and unit variance."],"explanation":"Perfect multicollinearity makes XᵀX singular (non-invertible), so the inverse does not exist and the OLS solution is not unique. The number of observations, distribution of y, and standardization do not affect invertibility directly."},
{"id":5,"topic":"Batch Gradient Descent","level":"Easy","prompt":"Batch gradient descent computes the gradient using all training examples before each parameter update. What is the primary disadvantage compared to stochastic or mini-batch variants?","options":["Each update step is computationally expensive and memory-intensive for large datasets.","It cannot converge to a local minimum for convex loss functions.","It requires a different learning rate for every training example.","It introduces higher variance into gradient estimates than single-example updates."],"explanation":"Using all examples per update makes each step slow and requires holding the full dataset in memory. For convex problems it still converges. It produces lower-variance gradient estimates than SGD, not higher."},
{"id":6,"topic":"SGD and Mini-Batch GD","level":"Easy","prompt":"Mini-batch gradient descent is preferred over full-batch gradient descent in practice primarily because it balances which two competing factors?","options":["Computational efficiency of vectorized updates and noise that helps escape sharp minima.","Exact gradient estimation and zero memory requirement.","Guaranteed convergence speed and zero learning rate sensitivity.","Complete use of all data per update and elimination of hyperparameter tuning."],"explanation":"Mini-batches exploit GPU vectorization (efficiency) while the sampling noise in gradient estimates can help the optimizer avoid sharp local minima and saddle points, improving generalization."},
{"id":7,"topic":"Evaluation Metrics","level":"Easy","prompt":"A binary classifier has high precision but very low recall. What does this combination imply about its behavior?","options":["It predicts positive rarely, but when it does, it is almost always correct.","It predicts positive frequently, capturing nearly all true positives with few false positives.","It has a high false positive rate and a low false negative rate.","Its predictions are random, so precision and recall are both near 0.5."],"explanation":"High precision means the few positive predictions it makes are correct (low false positives). Low recall means it misses many actual positives (high false negatives). The model is conservative in predicting the positive class."},
{"id":8,"topic":"Polynomial Regression","level":"Easy","prompt":"Adding polynomial features of degree d to a linear regression model primarily affects which aspect of the bias-variance tradeoff?","options":["Decreases bias by increasing model flexibility, at the risk of increasing variance.","Increases bias by restricting the model to linear decision boundaries.","Decreases both bias and variance simultaneously for any degree d.","Has no effect on the bias-variance tradeoff; only regularization affects it."],"explanation":"Higher-degree polynomial features allow the model to fit more complex patterns (lower bias), but the added flexibility can cause the model to overfit training noise (higher variance), especially at large d."},
{"id":9,"topic":"Assumptions of Linear Regression","level":"Easy","prompt":"Heteroscedasticity in linear regression refers to which violation of OLS assumptions?","options":["The variance of residuals is not constant across the range of fitted values.","Residuals are correlated with each other across observations.","The relationship between predictors and response is nonlinear.","Two or more predictors are highly correlated with each other."],"explanation":"Heteroscedasticity means the spread (variance) of residuals changes with the level of the predictor or fitted value. OLS assumes homoscedasticity (constant residual variance) for efficiency. Correlated residuals are autocorrelation; nonlinearity and predictor correlation are separate issues."},
{"id":10,"topic":"Bias-Variance Tradeoff","level":"Easy","prompt":"A model with very high training accuracy but poor validation accuracy is most likely suffering from which condition?","options":["High variance (overfitting): the model has learned noise specific to the training set.","High bias (underfitting): the model is too simple to capture the true relationship.","High bias and high variance simultaneously, which is impossible in practice.","Perfect calibration: training and validation accuracy must always be equal."],"explanation":"Large gap between training and validation performance is the hallmark of overfitting (high variance). The model memorizes training-specific patterns that do not generalize. Underfitting produces poor performance on both sets."},
{"id":11,"topic":"Feature Selection","level":"Medium","prompt":"Recursive Feature Elimination (RFE) selects features by iteratively removing the least important features based on model coefficients or importances. What is a key limitation of this approach?","options":["It evaluates features in the context of the model, so importance can change as features are removed.","It always selects more features than necessary, causing the final model to overfit.","It cannot be used with any linear model, only with tree-based models.","It requires the dataset to have no missing values and exactly balanced classes."],"explanation":"RFE is wrapper-based: importance is measured relative to the remaining feature set. Removing a feature changes which others are 'least important'. This makes it computationally expensive and sensitive to the order of elimination, especially with correlated features."},
{"id":12,"topic":"Principal Component Analysis","level":"Medium","prompt":"In PCA, principal components are chosen to maximize which quantity?","options":["The variance of projections of the data onto each successive orthogonal direction.","The correlation between each component and the original target variable.","The reconstruction error measured by mean absolute error.","The Euclidean distance between centroids of different class clusters."],"explanation":"PCA finds orthogonal directions (principal components) in feature space that maximize the variance of projected data points. The first PC captures the most variance, each subsequent one captures the most remaining variance, subject to orthogonality."},
{"id":13,"topic":"Regularization","level":"Medium","prompt":"Ridge regression (L2) and Lasso regression (L1) both shrink coefficients, but Lasso has an additional property that Ridge does not. What is it?","options":["Lasso can set some coefficients to exactly zero, performing implicit feature selection.","Lasso always produces a lower training error than Ridge for the same regularization strength.","Lasso is differentiable everywhere, making it easier to optimize than Ridge.","Lasso produces a unique solution regardless of multicollinearity, unlike Ridge."],"explanation":"The L1 penalty creates a loss surface with corners at the axes; the optimal solution can land exactly on a coordinate axis, setting the coefficient to zero. Ridge's smooth L2 penalty shrinks coefficients toward zero but rarely to exactly zero."},
{"id":14,"topic":"Time Series Analysis","level":"Medium","prompt":"An ACF plot of a time series shows significant autocorrelation at lags 1 and 2, with all subsequent lags inside the confidence band. The PACF cuts off after lag 1. Which model order is most consistent with this pattern?","options":["AR(1): one autoregressive term, based on the PACF cut-off.","MA(2): two moving-average terms, based on the ACF cut-off at lag 2.","ARMA(1,2): mixed model required because both ACF and PACF are significant.","ARIMA(0,1,0): first differencing alone resolves the autocorrelation."],"explanation":"When the PACF cuts off sharply at lag p and the ACF decays, the series follows an AR(p) model. Here the PACF cuts off after lag 1, indicating AR(1). The ACF of an AR(1) decays geometrically, consistent with significance at lags 1 and 2."},
{"id":15,"topic":"MLE and Logistic Regression","level":"Medium","prompt":"Maximum Likelihood Estimation for logistic regression requires maximizing the log-likelihood. Why is log-likelihood preferred over likelihood directly?","options":["It converts a product of probabilities into a sum, improving numerical stability and simplifying optimization.","It changes the problem from maximization to minimization, allowing gradient descent to be applied.","It guarantees a convex objective even for non-linear activation functions.","It reduces the number of parameters that need to be estimated."],"explanation":"The likelihood is a product of probabilities (values between 0 and 1), which causes numerical underflow for large datasets. Taking the log converts it to a sum of log-probabilities, stabilizes computation, and preserves the same optimal parameter values since log is monotone."},
{"id":16,"topic":"Gradient Descent on Logistic Regression","level":"Medium","prompt":"In logistic regression, the gradient of the binary cross-entropy loss with respect to the weight vector w has a particularly clean form. What is it?","options":["Xᵀ(σ(Xw) − y): the transpose of the feature matrix times the residual between predictions and labels.","2Xᵀ(Xw − y): the same gradient as OLS linear regression scaled by 2.","−Xᵀy: the negative correlation between features and labels.","Xᵀdiag(σ(1−σ))X w: a second-order Hessian-weighted update."],"explanation":"The gradient of BCE loss for logistic regression is Xᵀ(ŷ − y), where ŷ = σ(Xw). This clean form arises because the sigmoid's derivative cancels with the log's derivative in the chain rule, leaving only the prediction residual."},
{"id":17,"topic":"Multiclass Classification","level":"Medium","prompt":"Softmax output for class k is exp(zₖ)/Σexp(zⱼ). Subtracting a constant c from all logits before applying softmax does not change the output probabilities. Why is this property useful?","options":["It prevents numerical overflow by subtracting the maximum logit, ensuring all exponents are ≤ 1.","It allows the model to learn faster by reducing the gradient magnitude.","It removes the need for a bias term in the final linear layer.","It guarantees that all output probabilities are exactly equal before training begins."],"explanation":"Subtracting the maximum logit (log-sum-exp trick) caps the largest exponent at e⁰=1, preventing overflow. The probabilities are identical because the constant cancels in numerator and denominator, so this is a numerically stable equivalence."},
{"id":18,"topic":"Bias-Variance Tradeoff","level":"Medium","prompt":"Cross-validation estimates generalization error by averaging test error across K folds. How does increasing K affect bias and variance of this estimate?","options":["Larger K reduces bias (more training data per fold) but increases variance (more overlap between folds).","Larger K increases bias and reduces variance, making the estimate more stable but less accurate.","Larger K has no effect on bias or variance; only the dataset size matters.","Larger K always reduces both bias and variance, so K = N (leave-one-out) is always preferred."],"explanation":"With larger K each fold uses nearly the full dataset for training (low bias). However, the K test sets share most of their training data, so their errors are correlated, increasing variance of the K-fold estimate. Leave-one-out has lowest bias but highest variance."},
{"id":19,"topic":"Regularization","level":"Medium","prompt":"Elastic Net regularization combines L1 and L2 penalties. When would a practitioner prefer Elastic Net over pure Lasso?","options":["When predictors are highly correlated and Lasso's tendency to select only one from a correlated group is undesirable.","When the true model has no sparse structure and all features should have non-zero coefficients.","When computation time is the primary constraint and a simpler penalty is preferred.","When the response variable is categorical rather than continuous."],"explanation":"Lasso tends to select one feature arbitrarily from a correlated group and ignore others. Elastic Net's L2 component encourages a grouping effect, distributing coefficients across correlated predictors, which gives more stable and interpretable selections."},
{"id":20,"topic":"PCA","level":"Medium","prompt":"After applying PCA and retaining k components, a new test observation x_test must be projected to the reduced space. Which operation correctly projects it using the PCA loading matrix V (columns = principal components)?","options":["z = Vᵀ(x_test − x̄): subtract the training mean, then project onto component axes.","z = V(x_test − x̄): multiply loading matrix (not transpose) by the centered observation.","z = Vᵀx_test: project without centering, preserving the original origin.","z = x_test / V: divide by the loading matrix to recover the latent coordinates."],"explanation":"PCA requires centering the data using the training mean before projection (to apply the same transformation). The projection onto k components is Vᵀ(x − x̄), where V contains the top k eigenvectors as columns."},
{"id":21,"topic":"Stochastic Gradient Descent","level":"Hard","prompt":"SGD with a fixed learning rate is applied to a strongly convex objective. Theory guarantees convergence, but the iterate oscillates rather than settling at the minimum. What modification provably achieves the O(1/T) convergence rate for strongly convex objectives?","options":["Averaging the parameter iterates over all T steps (Polyak-Ruppert averaging) rather than using the final iterate.","Increasing the learning rate geometrically at each step to overcome the noise floor.","Switching to batch gradient descent after a fixed number of SGD steps.","Adding an L2 penalty whose strength increases linearly with the number of steps."],"explanation":"With a fixed learning rate, SGD converges to a neighborhood of the optimum and oscillates due to gradient noise. Polyak-Ruppert averaging of all iterates provably achieves O(1/T) rate for strongly convex functions by canceling noise in the average."},
{"id":22,"topic":"OLS and Matrix Algebra","level":"Hard","prompt":"The hat matrix H = X(XᵀX)⁻¹Xᵀ projects y onto the column space of X. A data point with a diagonal entry hᵢᵢ close to 1 is called a high-leverage point. What does this imply about how OLS estimates are influenced?","options":["The fitted value ŷᵢ is dominated by the observed yᵢ rather than the other observations, giving it outsized influence.","The residual for observation i is large, indicating the point is an outlier.","The point contributes equally to all coefficient estimates by definition of OLS.","The observation will be automatically down-weighted by the OLS estimator."],"explanation":"hᵢᵢ measures how much the fitted value ŷᵢ depends on yᵢ itself. When hᵢᵢ = 1, ŷᵢ = yᵢ exactly, regardless of other data. High-leverage points occupy unusual positions in feature space and can strongly influence the fitted regression hyperplane."},
{"id":23,"topic":"Regularization","level":"Hard","prompt":"For Ridge regression with penalty λ, as λ → ∞, the coefficient vector β̂(λ) approaches a specific limit. What is it?","options":["The zero vector: all coefficients shrink to 0 as the penalty dominates the fit term.","The OLS estimate: the penalty vanishes and the standard solution is recovered.","A vector proportional to the first principal component of X.","A vector that minimizes the L1 norm of residuals instead of the L2 norm."],"explanation":"Ridge minimizes ‖y − Xβ‖² + λ‖β‖². As λ → ∞, the penalty term dominates and forces β → 0 to avoid infinite penalty. As λ → 0, the Ridge solution approaches OLS."},
{"id":24,"topic":"PCA and Eigendecomposition","level":"Hard","prompt":"PCA via eigendecomposition of the covariance matrix C = (1/(n−1))XᵀX and PCA via SVD of the data matrix X are related. If X = UΣVᵀ, what are the principal components (loading vectors)?","options":["The columns of V (right singular vectors), which are the eigenvectors of XᵀX.","The columns of U (left singular vectors), which are the eigenvectors of XXᵀ.","The diagonal entries of Σ (singular values), which equal the principal component variances.","The columns of UΣ, which give the scores in the original feature space."],"explanation":"The SVD decomposes X into UΣVᵀ. The columns of V are the right singular vectors, which are identical to the eigenvectors of XᵀX (the sample covariance, up to scaling). These are the principal component directions (loadings). U gives the scores."},
{"id":25,"topic":"Time Series Analysis","level":"Hard","prompt":"An ARIMA(p,d,q) model is applied to a series that is stationary after first differencing. The ACF of the differenced series decays slowly. What does this pattern indicate and how should the model order be adjusted?","options":["Slow ACF decay after differencing suggests a non-invertible MA component or insufficient differencing; check PACF and consider ARIMA(p,2,q).","Slow ACF decay confirms the series is stationary; proceed with ARMA(0,0) (white noise).","The series requires no further differencing; slow decay indicates a very large AR order is optimal.","Slow ACF decay is expected for all ARIMA models; the order selection is unaffected."],"explanation":"If the ACF decays very slowly even after differencing, the series may still not be fully stationary, suggesting over-differencing or the need for an additional difference. A cut-off PACF after lag p would indicate AR(p); slow decay in both may indicate mixed ARMA structure."},
{"id":26,"topic":"Logistic Regression","level":"Hard","prompt":"Logistic regression finds the maximum likelihood estimate for a linearly separable binary dataset. What pathological behavior can occur?","options":["The MLE does not exist: coefficients diverge to infinity as the sigmoid pushes predictions to exactly 0 or 1.","The model converges to the Bayes optimal classifier in finite steps.","The cross-entropy loss becomes negative, indicating a degenerate solution.","Gradient descent oscillates and never converges because the loss is non-convex for separable data."],"explanation":"For linearly separable data, the log-likelihood can be made arbitrarily close to 0 (maximum) by scaling the weight vector to infinity, driving sigmoid outputs to 0 or 1. The MLE is not achieved at a finite point. Regularization (L2) prevents this by penalizing large weights."},
{"id":27,"topic":"Regularization and Model Selection","level":"Hard","prompt":"The LASSO solution path (coefficients vs. λ) has a characteristic piecewise-linear shape when solved via LARS (Least Angle Regression). What property of the L1 penalty causes this structure?","options":["The L1 subdifferential's structure creates kink points where different active sets of non-zero coefficients are optimal.","The L1 penalty is quadratic near zero, creating smooth transitions between active sets.","LARS inherently linearizes any regularization path regardless of the penalty type.","The piecewise-linear shape results from rounding errors in the coordinate descent solver."],"explanation":"The L1 penalty is non-differentiable at zero, creating corners. The optimal active set (non-zero coefficients) changes at discrete λ values. Between these knot points the coefficients change linearly with λ, producing a piecewise-linear path that LARS traces exactly."},
{"id":28,"topic":"Gradient Descent","level":"Hard","prompt":"The learning rate η in gradient descent for a smooth L-Lipschitz-gradient function must satisfy η < 2/L to guarantee descent. What happens if η = 1/L exactly and the loss is strongly convex with parameter μ?","options":["Convergence is guaranteed at a linear rate proportional to (1 − μ/L) per step, the best constant-step rate.","The update overshoots the optimum and diverges regardless of strong convexity.","Convergence is guaranteed but the rate depends only on the dataset size, not μ or L.","The gradient descent updates are equivalent to Newton's method at this step size."],"explanation":"For a μ-strongly convex function with L-smooth gradient, step size η = 1/L guarantees linear (geometric) convergence with contraction factor (1 − μ/L) per iteration. This is the optimal descent guarantee for first-order methods with this step size."},
{"id":29,"topic":"Feature Selection","level":"Hard","prompt":"Mutual information between a feature X and target Y measures I(X;Y) = H(Y) − H(Y|X). A feature with zero mutual information with Y but non-zero pairwise correlation with another feature Z (which has high MI with Y) may still be selected. What selection strategy would most correctly exclude it?","options":["Conditional MI screening: check I(X;Y|Z) to measure X's contribution given Z is already selected.","Filter by Pearson correlation threshold: keep only features with |corr(X,Y)| above a cutoff.","Use L1 regularization (Lasso), which always removes zero-MI features before non-zero-MI features.","Apply forward stepwise selection initialized with the zero-MI feature to expose its irrelevance."],"explanation":"Pairwise MI I(X;Y) can be zero while X provides no information beyond Z. Conditional MI I(X;Y|Z) tests whether X adds information about Y after conditioning on Z. If zero, X is redundant given Z. Pairwise correlation and Lasso do not directly capture this conditional structure."},
{"id":30,"topic":"Polynomial Regression and Assumptions","level":"Hard","prompt":"A polynomial regression model is fit to n data points using a degree-(n−1) polynomial. The model achieves zero training error. What happens to the bias and variance of the model?","options":["Bias is zero (perfect fit), but variance is extremely high — the model interpolates all training points but generalizes poorly.","Bias and variance are both zero because the model fits perfectly.","Bias is high because polynomial regression can never interpolate data exactly.","Variance is zero because the model is fully determined by the n points."],"explanation":"A degree-(n−1) polynomial passes through all n training points (Lagrange interpolation), yielding zero training error and zero bias. However, the model oscillates wildly between data points, producing extreme variance. This is the classic overfitting extreme."}

{"id":31,"topic":"Binary Cross-Entropy Loss","level":"Easy","prompt":"Which expression correctly represents the binary logistic-regression loss J(β) for n observations?","options":["J(β) = −(1/n) Σ[yi log(p̂i) + (1−yi)log(1−p̂i)]","J(β) = (1/n) Σ(yi + p̂i)","J(β) = Σ(yi − p̂i)","J(β) = βᵀβ"],"explanation":"The average binary cross-entropy sums the log-probability of the true label for each observation and negates it. The 1/n factor converts the total to an average over all n examples."},
{"id":32,"topic":"Chain Rule – Logistic Gradient","level":"Medium","prompt":"Applying the chain rule, what is the per-example gradient of the BCE loss with respect to parameter βj?","options":["(p̂i − yi)xij","(yi − p̂i)xij","p̂i(1 − p̂i)xij","(p̂i + yi)xij"],"explanation":"The sigmoid derivative p̂i(1−p̂i) exactly cancels the denominator from the BCE derivative, leaving prediction minus target times the feature value xij as the clean per-example gradient."},
{"id":33,"topic":"Batch Gradient Descent – Vectorized Update","level":"Medium","prompt":"What is the vector-form gradient of the logistic-regression BCE loss over all n observations?","options":["∇βJ = (1/n)Xᵀ(p̂ − y)","∇βJ = X(p̂ + y)","∇βJ = (1/n)X(y − p̂)","∇βJ = XᵀXβ"],"explanation":"Stacking all per-example gradients (p̂i − yi)xij into matrix form yields (1/n)Xᵀ(p̂ − y), compressing the full batch update into one matrix-vector product."},

let correct=0,wrong=0,answered=0;
const LETTERS=['A','B','C','D'];
const correctMap={};
function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateHeader(){document.getElementById('hdr-correct').textContent=correct;document.getElementById('hdr-wrong').textContent=wrong;document.getElementById('hdr-remain').textContent=BANK.length-answered;document.getElementById('progress-bar').style.width=(answered/BANK.length*100)+'%';}
function buildQuiz(){const root=document.getElementById('quiz-root');root.innerHTML='';['Easy','Medium','Hard'].forEach(level=>{const qs=BANK.filter(q=>q.level===level);const section=document.createElement('div');section.className='level-section';section.innerHTML=`<div class="level-header"><span class="level-badge ${level}">${level}</span><span class="level-count">${qs.length} questions</span><span class="level-score" id="score-${level}">0 answered</span></div><div class="q-grid" id="grid-${level}"></div>`;root.appendChild(section);const grid=section.querySelector('#grid-'+level);qs.forEach(q=>{const card=document.createElement('div');card.className='q-card';card.id='q-'+q.id;const idxArr=shuffleArr([0,1,2,3]);const shuffled=idxArr.map(i=>q.options[i]);correctMap[q.id]=idxArr.indexOf(0);card.innerHTML=`<div class="q-meta"><div class="q-num ${level}">${q.id}</div><span class="q-topic">${q.topic}</span></div><div class="q-prompt">${q.prompt}</div><div class="options">${shuffled.map((opt,i)=>`<button class="opt-btn" onclick="answer(${q.id},${i})"><span class="opt-letter">${LETTERS[i]}</span><span>${opt}</span></button>`).join('')}</div><div id="fb-${q.id}"></div>`;grid.appendChild(card);});});}
function answer(qId,chosenIdx){const q=BANK.find(x=>x.id===qId);const card=document.getElementById('q-'+qId);const feedback=document.getElementById('fb-'+qId);const btns=card.querySelectorAll('.opt-btn');btns.forEach(b=>b.disabled=true);const correctIdx=correctMap[qId];const isCorrect=chosenIdx===correctIdx;btns.forEach((btn,i)=>{if(i===correctIdx)btn.classList.add('correct');else if(i===chosenIdx&&!isCorrect)btn.classList.add('wrong');else btn.classList.add('neutral');});if(isCorrect){correct++;feedback.innerHTML=`<div class="result-badge correct"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Correct!</div><div class="explanation">${q.explanation}</div>`;}else{wrong++;feedback.innerHTML=`<div class="result-badge wrong"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Incorrect — correct answer highlighted above</div><div class="explanation">${q.explanation}</div>`;}answered++;updateHeader();const sc=document.getElementById('score-'+q.level);if(sc){const done=BANK.filter(x=>x.level===q.level).filter(x=>{const c=document.getElementById('q-'+x.id);return c&&c.querySelector('.opt-btn[disabled]');}).length;sc.textContent=done+' answered';}}
function resetAll(){correct=0;wrong=0;answered=0;Object.keys(correctMap).forEach(k=>delete correctMap[k]);updateHeader();buildQuiz();}
buildQuiz();updateHeader();
</script>
